name: Bug report
description: Report a compiler, runtime, or package-manager defect
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the smallest program and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Toolchain and platform
      description: Include emlf --version, mlfpkg --version, OS, architecture, and relevant native tools.
    validations:
      required: true
