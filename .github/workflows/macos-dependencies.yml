name: Pinned macOS dependencies
on:
  pull_request:
    paths:
      - .github/macos-dependencies.env
      - .github/workflows/macos-dependencies.yml
      - tools/release/setup-macos.sh
      - tools/release/test-setup-macos.sh
    types: [opened, synchronize, reopened, labeled, unlabeled]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Label notifications outside this workflow’s policy must not cancel real checks.
  group: macos-dependencies-${{ (!github.event.label || github.event.label.name == 'ci:skip') && github.ref || github.run_id }}
  cancel-in-progress: true
jobs:
  producer:
    name: producer${{ github.event.label && github.event.label.name != 'ci:skip' && ' (unrelated label)' || '' }}
    if: >-
      (!github.event.label || github.event.label.name == 'ci:skip') &&
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip'))
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned native dependencies
        run: tools/release/setup-macos.sh benchmarks
      - name: Record native dependency files
        run: python3 -B tools/testing/run.py macos-dependencies-record
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pinned-macos-dependency-hashes
          include-hidden-files: true
          path: |
            .mlf-build/macos-dependencies/closure.txt
            .mlf-build/macos-dependencies/homebrew-core-commit
            .mlf-build/macos-dependencies/installed.json
            .mlf-build/macos-dependencies/files.sha256
          retention-days: 7
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pinned-macos-dependency-record-receipts
          include-hidden-files: true
          path: .mlf-build/test-framework/
          retention-days: 7
  consumer:
    name: consumer${{ github.event.label && github.event.label.name != 'ci:skip' && ' (unrelated label)' || '' }}
    needs: producer
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install independently from the same immutable formulas
        run: tools/release/setup-macos.sh benchmarks
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: pinned-macos-dependency-hashes
          path: .mlf-build/producer-dependencies
      - name: Require identical native input bytes on the second runner
        run: python3 -B tools/testing/run.py macos-dependencies-verify -- .mlf-build/producer-dependencies
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pinned-macos-dependency-verification
          include-hidden-files: true
          path: |
            .mlf-build/test-framework/
            .mlf-build/macos-dependencies/verification.log
