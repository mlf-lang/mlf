  build-runner:
    name: Native build runner (${{ matrix.os }})
    if: >-
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip')) &&
      (github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only)
    strategy:
      fail-fast: false
      matrix:
        # PR and merge-queue gates stay on Linux; main/manual runs retain macOS.
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-26"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Exercise bounded scheduling, protocols, and descendant cleanup
        shell: bash
        run: python3 -B tools/testing/run.py native-build-tools --report .mlf-build/test-framework/native-build-tools.json -- "$PWD/.mlf-build/build-runner-ci"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: build-runner-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .mlf-build/test-framework/
            .mlf-build/build-runner-ci/*.log
            .mlf-build/build-runner-ci/binaries.sha256
            .mlf-build/build-runner-ci/process-evidence/
            .mlf-build/build-runner-ci/evidence/**/*.plan
            .mlf-build/build-runner-ci/evidence/**/*.result
  async-runtime:
    name: Native async completions (${{ matrix.os }})
    if: >-
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip')) &&
      (github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only)
    strategy:
      fail-fast: false
      matrix:
        # Keep real macOS coverage without queueing the required pre-merge gate.
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-26"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native runtime test dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libgc-dev libgmp-dev pkg-config
          else
            brew install bdw-gc gmp pkg-config
          fi
      - name: Exercise traced completions, primitive dispatch, and timers
        shell: bash
        run: python3 -B tools/testing/run.py native-async-runtime --report .mlf-build/test-framework/native-async-runtime.json -- "$PWD/.mlf-build/async-native-ci"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: async-native-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .mlf-build/async-native-ci/*.log
            .mlf-build/async-native-ci/binaries.sha256
            .mlf-build/test-framework/
  async-language:
    name: Async interpreter and native parity (${{ matrix.os }})
    if: >-
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip')) &&
      (github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only)
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-26"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Decide whether expensive async parity was explicitly requested
        id: scope
        run: python3 tools/release/async-change-scope.py --output .mlf-build/async-change-scope/decision.json
      - name: GHC-origin bootstrap and native parity dependencies
        if: steps.scope.outputs.required != 'false'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y build-essential clang-19 llvm-19 libgmp-dev libgc-dev libnuma-dev libncurses-dev pkg-config jq xz-utils
            echo /usr/lib/llvm-19/bin >> "$GITHUB_PATH"
          else
            brew install llvm@19 gmp pkg-config bdw-gc jq
            echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"
            echo "MLF_GC_PREFIX=$(brew --prefix bdw-gc)" >> "$GITHUB_ENV"
          fi
          echo 'GC_FREE_SPACE_DIVISOR=8' >> "$GITHUB_ENV"
      - name: Install pinned GHC 9.14.1 for ordinary async parity
        if: steps.scope.outputs.required != 'false'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          if [ "$RUNNER_OS" = Linux ]; then
            distribution=ghc-9.14.1-x86_64-deb12-linux
            staging=ghc-9.14.1-x86_64-unknown-linux
            digest=60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841
          else
            test "$(uname -m)" = arm64
            distribution=ghc-9.14.1-aarch64-apple-darwin
            staging=$distribution
            digest=841591f152085be605616682779341847d24fd56bd6d22ca61bb37ee32b50681
          fi
          curl -fsSL "https://downloads.haskell.org/~ghc/9.14.1/$distribution.tar.xz" -o "$archive"
          printf '%s  %s\n' "$digest" "$archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/$staging" && ./configure --prefix="$RUNNER_TEMP/ghc" && make install)
          test "$("$RUNNER_TEMP/ghc/bin/ghc" --numeric-version)" = 9.14.1
          if [ "$RUNNER_OS" = Linux ]; then
            python3 -B tools/release/cleanup-ghc-install.py --receipt .mlf-build/async-ghc-install-cleanup.json
          fi
          echo "$RUNNER_TEMP/ghc/bin" >> "$GITHUB_PATH"
      - name: Test GHC async preparation controls
        if: steps.scope.outputs.required != 'false'
        run: |
          python3 -B tools/testing/run.py python-shared-prepare-async-ghc
          python3 -B tools/testing/run.py python-shared-prepare-async-ghc --python-optimization
      - name: Build and authenticate GHC-origin async tools
        if: steps.scope.outputs.required != 'false'
        run: python3 -B tools/shared/prepare_async_ghc.py --build-dir .mlf-build/async-ghc --clang clang
      - name: Qualify typed completions and structured process tasks
        if: steps.scope.outputs.required != 'false'
        run: |
          set -euo pipefail
          compiler="$PWD/.mlf-build/async-ghc/bin/emlf"
          EMLF="$compiler" python3 -B tools/testing/run.py async-completion
          python3 -B tools/testing/run.py async-process -- "$compiler" .mlf-build/async-process-parity
          python3 -B tools/testing/run.py async-task -- "$compiler" .mlf-build/async-task-parity
          jq -e '.complete == true and .backends == ["source-interpreter", "target-interpreter", "llvm"]' .mlf-build/async-completion-gate/result.json
          for suite in async-process-parity async-task-parity; do
            jq -e '.complete == true and .backends == ["interpreter", "llvm"]' ".mlf-build/$suite/result.json"
          done
      - name: Qualify checked async package interfaces and cache replay
        if: steps.scope.outputs.required != 'false'
        run: |
          set -euo pipefail
          compiler="$PWD/.mlf-build/async-ghc/bin/emlf"
          manager="$PWD/.mlf-build/async-ghc/bin/mlfpkg"
          python3 -B tools/testing/run.py async-package -- "$compiler" "$manager" .mlf-build/async-package-parity
          jq -e '.complete == true and .backend == "llvm" and .cache_replay == true and .opaque_rejections == 6 and .type_rejections == 1' \
            .mlf-build/async-package-parity/result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: async-language-evidence-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/test-framework/
            .mlf-build/async-change-scope/decision.json
            .mlf-build/async-ghc-install-cleanup.json
            .mlf-build/async-ghc/async-tools.json
            .mlf-build/async-ghc/receipt.json
            .mlf-build/async-ghc/*.stdout
            .mlf-build/async-ghc/*.stderr
            .mlf-build/async-ghc/*.txt
            .mlf-build/async-ghc/*.log
            .mlf-build/async-ghc/builtin-verification/
            .mlf-build/async-completion-gate/**/*.json
            .mlf-build/async-completion-gate/**/*.stdout
            .mlf-build/async-completion-gate/**/*.stderr
            .mlf-build/async-completion-gate/**/*.status
            .mlf-build/async-completion-gate/**/*.timed-out
            .mlf-build/async-process-parity/**/*.json
            .mlf-build/async-process-parity/**/*.stdout
            .mlf-build/async-process-parity/**/*.stderr
            .mlf-build/async-process-parity/**/*.status
            .mlf-build/async-process-parity/**/*.timed-out
            .mlf-build/async-task-parity/**/*.json
            .mlf-build/async-task-parity/**/*.stdout
            .mlf-build/async-task-parity/**/*.stderr
            .mlf-build/async-task-parity/**/*.status
            .mlf-build/async-task-parity/**/*.timed-out
            .mlf-build/async-package-parity/**/*.json
            .mlf-build/async-package-parity/**/*.stdout
            .mlf-build/async-package-parity/**/*.stderr
            .mlf-build/async-package-parity/**/*.status
            .mlf-build/async-package-parity/**/*.timed-out
  windows-runtime:
    name: Native Windows runtime
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip')
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned native Windows dependencies
        run: tools/release/setup-windows.ps1 -Output .mlf-build/windows-dependencies
      - name: Test native runtime, filesystem, and build runner lifecycles
        run: python -B tools/testing/run.py windows-runtime -- -NativePrefix $env:MLF_NATIVE_PREFIX -Clang $env:MLF_CLANG -Output .mlf-build/windows-runtime
      - name: Require long-path regression to reject the pre-fix runner
        run: python -B tools/testing/run.py windows-long-path -- -Clang $env:MLF_CLANG -Output .mlf-build/windows-runtime
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-runtime-evidence
          include-hidden-files: true
          path: |
            .mlf-build/test-framework/
            .mlf-build/windows-runtime/*.json
            .mlf-build/windows-runtime/*.log
            .mlf-build/windows-runtime/build-runner/**/*.plan
            .mlf-build/windows-runtime/build-runner/**/*.result
  pr-gate:
    # A skipped manual job must not satisfy the required check on the same SHA.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI summary' || 'PR gate' }}
    if: always() && github.event_name != 'workflow_dispatch'
    # The native dependency covers the hosted routine and optimizer profiles.
    needs: [metadata, native, windows-runtime, build-runner, async-runtime, async-language]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Record the CI skip label
        if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'ci:skip')
        env:
          CHECKS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$CHECKS" | jq -e 'length == 6 and all(.[]; .result == "skipped")'
          printf '%s\n' 'The ci:skip PR label skipped the CI test jobs.' >> "$GITHUB_STEP_SUMMARY"
      - name: Require every merge check to succeed
        if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip')
        env:
          CHECKS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$CHECKS" | jq -e 'length == 6 and all(.[]; .result == "success")'
  qualification:
    name: Complete main qualification
    # Automatic native qualification is paused at the user's request.
    # Keep the entire optional layer available only through explicit manual dispatch.
    if: github.event_name == 'workflow_dispatch' && (inputs.full_validation || inputs.self_host) && !inputs.windows_runtime_only
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-qualification.yml
    with:
      source: ${{ github.sha }}
      build_packages: false
