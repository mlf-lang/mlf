name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all native qualification campaigns and the complete Benchmark Game
        type: boolean
        default: false
      self_host:
        description: Run complete qualification (includes the fresh self-host fixed point)
        type: boolean
        default: false
      windows_runtime_only:
        description: Run only the native Windows runtime regressions
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    name: Release metadata
    if: github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - run: tools/release/check.sh
      - name: Test pinned GHC install-input cleanup guards
        run: |
          python3 -B tools/testing/run.py python-release-ghc-install-cleanup
          python3 -B tools/testing/run.py python-release-ghc-install-cleanup --python-optimization
      - name: Test builtin generation evidence boundaries
        run: |
          python3 -B tools/testing/run.py python-shared-generate-builtin-evidence
          python3 -B tools/testing/run.py python-shared-generate-builtin-evidence --python-optimization
      - name: Test query graph verifier versions and attack fixtures
        run: |
          python3 -B tools/testing/run.py python-shared-query-index
          python3 -B tools/testing/run.py python-shared-query-index --python-optimization
          python3 -B tools/testing/run.py python-shared-query-generation
          python3 -B tools/testing/run.py python-shared-query-generation --python-optimization
          python3 -B tools/testing/run.py python-crate-query-graph-verify
          python3 -B tools/testing/run.py python-crate-query-graph-verify --python-optimization
      - name: Verify unit evidence with jq 1.8.2
        run: |
          set -euo pipefail
          jq --version
          mkdir -p "$RUNNER_TEMP/jq-1.8.2"
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64 -o "$RUNNER_TEMP/jq-1.8.2/jq"
          printf '%s  %s\n' b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f "$RUNNER_TEMP/jq-1.8.2/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq-1.8.2/jq"
          test "$("$RUNNER_TEMP/jq-1.8.2/jq" --version)" = jq-1.8.2
          PATH="$RUNNER_TEMP/jq-1.8.2:$PATH" python3 -B tools/testing/run.py release-unit-evidence
      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          mkdir -p .mlf-build/actionlint
          cp "$RUNNER_TEMP/actionlint" .mlf-build/actionlint/actionlint
          python3 -B tools/testing/run.py workflow-lint
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: release-metadata-test-results
          path: .mlf-build/test-framework/
  native:
    # Preserve the required-check job ID, but label the producer honestly.
    name: Shared compiler source smoke (GHC O${{ matrix.optimization }}, ${{ matrix.suite }})
    if: >-
      (github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'ci:skip')) &&
      (github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - optimization: '0'
            suite: routine
          - optimization: '2'
            suite: optimizer
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # The framework oracle reads frozen Git fixtures.
      - name: Prepare reviewed historical source objects
        run: python3 -B tools/testing/prepare_history_refs.py
      - name: Install pinned direct-host GHC 9.14.1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libgc-dev libgmp-dev libnuma-dev libncurses-dev pkg-config xz-utils
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          curl -fsSL https://downloads.haskell.org/~ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz -o "$archive"
          printf '%s  %s\n' 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ghc-9.14.1-x86_64-unknown-linux" && ./configure --prefix="$RUNNER_TEMP/ghc" && make install)
          test "$("$RUNNER_TEMP/ghc/bin/ghc" --numeric-version)" = 9.14.1
          python3 -B tools/release/cleanup-ghc-install.py --receipt .mlf-build/ghc-install-cleanup.json
          echo "$RUNNER_TEMP/ghc/bin" >> "$GITHUB_PATH"
      # Share each authenticated producer across its selected checks.
      - name: Build exact committed shared sources and direct test runners
        id: shared_build
        run: |
          python3 tools/shared/build.py --bootstrap-only --optimization '${{ matrix.optimization }}' --build-dir .mlf-build/shared-ghc
          jq -e '.complete == true and .producer_host == "GHC" and .typecheck_only == false' .mlf-build/shared-ghc/receipt.json
      - name: Preserve actual builtin generation after freshness failure
        if: failure() && steps.shared_build.outcome == 'failure' && (matrix.suite == 'routine' || matrix.suite == 'optimizer')
        timeout-minutes: 16
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 900 --address-space-mib 6144 --rss-mib 5120 --max-output-mib 16 --disk-free-mib 4096 .mlf-build/builtin-generation-guard python3 -B tools/shared/generate_builtin_evidence.py --root "$PWD" --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/builtin-generation-guard/results --timeout 600
      - name: Check typed dependency graphs across the host, interpreter and LLVM
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/testing/run.py indexvec -- --compiler .mlf-build/shared-ghc/bin/emlf --output .mlf-build/indexvec-controls
      # The CLI writes query graphs; retained legacy .mlfq API controls remain below.
      - name: Check query graph fingerprints and publication recovery
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 600 --address-space-mib 6144 --rss-mib 5120 --max-output-mib 100 --disk-free-mib 4096 .mlf-build/source-ich-guard python3 -B tools/testing/run.py --inherit-process-group query-graph-acceptance -- .mlf-build/shared-ghc/bin/emlf .mlf-build/source-ich-guard/results
      - name: Check source query graph and lowered fallback
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 600 --address-space-mib 6144 --rss-mib 5120 --max-output-mib 100 --disk-free-mib 4096 .mlf-build/source-graph-guard python3 -B tools/testing/run.py --inherit-process-group source-query-api -- .mlf-build/shared-ghc/receipt.json .mlf-build/source-graph-guard/results
      - name: Check retained legacy query API contexts and codecs
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --max-output-mib 100 --disk-free-mib 4096 .mlf-build/source-context-cache-guard python3 -B tools/testing/run.py --inherit-process-group source-context-cache -- --legacy-query-only --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/source-context-cache-guard/results
      - name: Check compiler shape benchmark contract
        if: matrix.suite == 'optimizer'
        run: python3 -B tools/dev.py check-tools
      - name: Compile thirteen shapes at size 8 (GHC vs MLF, 156 timed builds)
        if: matrix.suite == 'optimizer'
        run: |
          python3 -B tools/testing/run.py compiler-shapes --report .mlf-build/test-framework/compiler-shapes-smoke.json -- all \
            --workdir .mlf-build/compiler-shapes-smoke --cohort pr-size-8 \
            --producer .mlf-build/shared-ghc --build-builtin --size 8 --repeats 6 --interleave-pairs \
            --family flat_functions --family recursive_ring --family wide_case \
            --family class_instances --family dependency_diamonds --family state_updates \
            --family captured_closures --family wide_product --family rank2_arguments \
            --family irregular_literal_table --family nested_poly_types --family rank2_callbacks --family decoder_pipeline
      - name: Check Int64 arithmetic and Patricia boundaries
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/testing/run.py python-patricia-adapters
          python3 -B tools/testing/run.py python-patricia-adapters --python-optimization
          python3 -B tools/testing/run.py python-patricia-fingerprint-core
          python3 -B tools/testing/run.py python-patricia-fingerprint-core --python-optimization
          python3 -B tools/testing/run.py python-patricia-native-batches
          python3 -B tools/testing/run.py python-patricia-native-batches --python-optimization
          python3 -B tools/testing/run.py python-patricia-design-controls
          python3 -B tools/testing/run.py python-patricia-design-controls --python-optimization
          python3 -B tools/testing/run.py python-artifact-binary-adapter-successor
          python3 -B tools/testing/run.py python-artifact-binary-adapter-successor --python-optimization
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-focused-guard python3 -B tools/testing/run.py --inherit-process-group patricia-focused -- --reference-source "$PWD" --reference-producer .mlf-build/shared-ghc --output .mlf-build/patricia-focused
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-design-guard python3 -B tools/testing/run.py --inherit-process-group patricia-design -- --reference-source "$PWD" --reference-producer .mlf-build/shared-ghc --output .mlf-build/patricia-design
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-native-guard python3 -B tools/testing/run.py --inherit-process-group patricia-native -- --producer .mlf-build/shared-ghc --output .mlf-build/patricia-native --mode standalone
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/llp64-guard python3 -B tools/testing/run.py --inherit-process-group llp64-controls -- --producer .mlf-build/shared-ghc --output .mlf-build/llp64-controls
          for suite in host native legacy; do
            python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 ".mlf-build/int64-$suite-guard" python3 -B tools/testing/run.py --inherit-process-group int64-controls -- --suite "$suite" --producer .mlf-build/shared-ghc --output ".mlf-build/int64-$suite" --gc-prefix /usr --gmp-prefix /usr --gc-library "$(pkg-config --variable=libdir bdw-gc)/libgc.a"
          done
      - name: Check complete datatype context reuse against frozen encoder
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/datatype-context-guard python3 -B tools/testing/run.py --inherit-process-group datatype-context -- --producer .mlf-build/shared-ghc --output .mlf-build/datatype-context
      - name: Check contract encoding reuse against frozen encoder
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/contract-context-guard python3 -B tools/testing/run.py --inherit-process-group contract-context -- --producer .mlf-build/shared-ghc --output .mlf-build/contract-context
      - name: Check owned source views and reservations against frozen paths
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 .mlf-build/owned-source-context-guard python3 -B tools/testing/run.py --inherit-process-group owned-source-context -- --producer .mlf-build/shared-ghc --output .mlf-build/owned-source-context
      - name: Check explicit P2 writer migration adapters
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/testing/run.py python-artifact-binary-p2-writer-bridge
          python3 -B tools/testing/run.py python-artifact-binary-p2-writer-bridge --python-optimization
      - name: Check finite P1-P3, A1 and F1 correctness
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/crate-optimization-guard python3 -B tools/testing/run.py --inherit-process-group patricia-integrated -- --suite p123 --producer .mlf-build/shared-ghc --output .mlf-build/crate-optimization-controls
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/a1-integrated-guard python3 -B tools/testing/run.py --inherit-process-group patricia-integrated -- --suite graph --producer .mlf-build/shared-ghc --output .mlf-build/a1-integrated-controls
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/f1-integrated-guard python3 -B tools/testing/run.py --inherit-process-group patricia-fingerprint -- --producer .mlf-build/shared-ghc --output .mlf-build/f1-integrated-controls
      - name: Check Map balance tree and demand semantics
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          MAP_POLICY_SOURCE="$PWD" python3 -B tools/testing/run.py python-map-policy-prepare-map-policy
          MAP_POLICY_SOURCE="$PWD" python3 -B tools/testing/run.py python-map-policy-prepare-map-policy --python-optimization
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/map-balance-guard python3 -B tools/testing/run.py --inherit-process-group map-policy -- --source "$PWD" --producer .mlf-build/shared-ghc --output .mlf-build/map-balance-controls
      - name: Check generated graph validation boundary
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/testing/run.py python-validation-reuse
          python3 -B tools/testing/run.py python-validation-reuse --python-optimization
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/validation-reuse-guard python3 -B tools/testing/run.py --inherit-process-group patricia-integrated -- --suite validation --producer .mlf-build/shared-ghc --output .mlf-build/validation-reuse-controls
      - name: Check canonical builtin and retained file cases
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/testing/run.py python-patricia-open-file-comparison
          python3 -B tools/testing/run.py python-patricia-open-file-comparison --python-optimization
          python3 -B tools/testing/run.py python-patricia-open-file-controls
          python3 -B tools/testing/run.py python-patricia-open-file-controls --python-optimization
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-builtin-guard python3 -B tools/testing/run.py --inherit-process-group patricia-integrated -- --suite builtin --producer .mlf-build/shared-ghc --output .mlf-build/patricia-builtin-controls
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-files-guard python3 -B tools/testing/run.py --inherit-process-group patricia-file-controls -- --reference-source "$PWD" --reference-producer .mlf-build/shared-ghc --producer .mlf-build/shared-ghc --builtin-prefix .mlf-build/patricia-builtin-controls/builtin --output .mlf-build/patricia-file-controls
      - name: Execute the actual shared suite-receipt helpers
        if: matrix.suite == 'routine'
        run: |
          python3 -B tools/testing/run.py release-build-receipts -- --executable .mlf-build/shared-ghc/bin/build-receipts --output .mlf-build/suite-receipt-regression
      - name: Execute source-bound shared smoke runner
        if: matrix.suite == 'routine'
        env:
          MLF_SOURCE_SMOKE_RUNNER: .mlf-build/shared-ghc/bin/source-smoke
          MLF_SOURCE_SMOKE_RECEIPT: .mlf-build/shared-ghc/receipt.json
        run: python3 -B tools/testing/run.py source-smoke
      - name: Qualify authenticated direct async and frontend execution
        if: matrix.suite == 'routine'
        run: |
          set -euo pipefail
          python3 -B tools/testing/run.py python-shared-crc-successor-entry
          python3 -B tools/testing/run.py python-shared-crc-successor-entry --python-optimization
          MLF_CRC_TEST_EVIDENCE=.mlf-build/crc-supervisor-controls/normal python3 -B tools/testing/run.py python-shared-crc-process-supervisor
          MLF_CRC_TEST_EVIDENCE=.mlf-build/crc-supervisor-controls/optimized python3 -B tools/testing/run.py python-shared-crc-process-supervisor --python-optimization
          python3 -B tools/testing/run.py python-shared-utf8-batch-contract
          python3 -B tools/testing/run.py python-shared-utf8-batch-contract --python-optimization
          python3 -B tools/testing/run.py python-shared-utf8-batch-worker
          python3 -B tools/testing/run.py python-shared-utf8-batch-worker --python-optimization
          MLF_UTF8_TEST_EVIDENCE=.mlf-build/utf8-supervisor-controls/normal python3 -B tools/testing/run.py python-shared-direct-bounded-entry
          MLF_UTF8_TEST_EVIDENCE=.mlf-build/utf8-supervisor-controls/optimized python3 -B tools/testing/run.py python-shared-direct-bounded-entry --python-optimization
          python3 -B tools/testing/run.py python-shared-candidate-batch-contract
          python3 -B tools/testing/run.py python-shared-candidate-batch-contract --python-optimization
          python3 -B tools/testing/run.py python-shared-candidate-batch-worker
          python3 -B tools/testing/run.py python-shared-candidate-batch-worker --python-optimization
          MLF_CANDIDATE_TEST_EVIDENCE=.mlf-build/candidate-supervisor-controls/normal python3 -B tools/testing/run.py python-shared-direct-candidate-entry
          MLF_CANDIDATE_TEST_EVIDENCE=.mlf-build/candidate-supervisor-controls/optimized python3 -B tools/testing/run.py python-shared-direct-candidate-entry --python-optimization
          python3 -B tools/testing/run.py direct-candidate -- --bin-dir .mlf-build/shared-ghc/bin \
            --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/direct-host-tests
      - name: Qualify hosted TupleList and framework contracts
        if: matrix.suite == 'routine'
        run: |
          python3 -B tools/testing/run.py framework-direct -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/framework-direct --suite all --suite-timeout 5400
      - name: Qualify optimized host demand and framework CLI contracts
        if: matrix.suite == 'optimizer'
        run: |
          python3 -B tools/testing/run.py framework-direct -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/framework-direct --suite controls
      - name: Build shared hosted campaign tools
        if: matrix.suite == 'routine'
        run: |
          clang -O2 -std=c11 -Wall -Wextra -Werror runtime/mlf_build_runner.c -o .mlf-build/shared-ghc/bin/mlf-build-runner
      - name: Qualify hosted tuple and list interpreter and LLVM parity
        if: matrix.suite == 'routine'
        run: python3 -B tools/testing/run.py tuple-list-native -- "$PWD/.mlf-build/shared-ghc/bin/emlf" .mlf-build/tuple-list-runtime
      - name: Run native lifecycle contracts with hosted tools
        if: matrix.suite == 'routine'
        run: |
          set -euo pipefail
          toolset="$PWD/.mlf-build/shared-ghc/bin"
          MLF_PACKAGE_MANAGER="$toolset/mlfpkg" MLF_BUILD_RUNNER="$toolset/mlf-build-runner" "$toolset/mlfpkg" \
            --manifest testing/tools/mlf-package.json --compiler "$toolset/emlf" --runtime "$PWD/runtime/mlf_runtime.c" \
            --build-dir "$PWD/.mlf-build/compiler-tests/lifecycle" --cache-dir "$PWD/.mlf-build/cache" --locked test --target lifecycle
      - name: Exercise hosted backend matrix and frozen parity corpus
        if: matrix.suite == 'routine'
        run: |
          set -euo pipefail
          toolset="$PWD/.mlf-build/shared-ghc/bin"
          export MLF_BUILD_RUNNER="$toolset/mlf-build-runner"
          for suite in backends parity; do
            options=()
            if test "$suite" = parity; then
              options=(--compiler-receipt "$PWD/.mlf-build/shared-ghc/receipt.json")
            fi
            "$toolset/compiler-tests" "$suite" --manager "$toolset/mlfpkg" --compiler "$toolset/emlf" \
              --build-dir "$PWD/.mlf-build/compiler-tests/$suite" --cache-dir "$PWD/.mlf-build/cache" "${options[@]}"
          done
      - name: Qualify exact maintained Figure12 fixtures
        if: matrix.suite == 'routine'
        run: |
          python3 -B tools/testing/run.py figure12-direct -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/figure12-direct
      - name: Check recursive managed evidence and source-group contracts
        if: matrix.optimization == '2'
        run: python3 -B tools/testing/run.py recursive-managed -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/recursive-managed
      - name: Check known parameter-field projection graph invariants
        if: matrix.optimization == '2'
        run: python3 -B tools/testing/run.py parameter-field-graph -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/parameter-field-graph
      - name: Check source field normalization and exact imported layouts
        if: matrix.optimization == '2'
        run: python3 -B tools/testing/run.py source-field-layouts -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/source-field-layouts
      - name: Check batched inlining against frozen optimizer
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 .mlf-build/batch-replacement-guard python3 -B tools/testing/run.py --inherit-process-group batch-replacement -- --producer .mlf-build/shared-ghc --output .mlf-build/batch-replacement-20261101/ci-controls
      - name: Check permission-view reuse against frozen graph
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 .mlf-build/permission-view-guard python3 -B tools/testing/run.py --inherit-process-group permission-view -- --producer .mlf-build/shared-ghc --producer-source "$PWD" --optimization 2 --output .mlf-build/permission-view-20261101/ci-controls
      - name: Check private-owner header adapters
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/testing/run.py python-c3-delayed-index-private-owner-headers
          python3 -B tools/testing/run.py python-c3-delayed-index-private-owner-headers --python-optimization
      - name: Check delayed fresh indexes against frozen private session
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 .mlf-build/c3-delayed-index-guard python3 -B tools/testing/run.py --inherit-process-group delayed-index -- --producer .mlf-build/shared-ghc --producer-source "$PWD" --optimization 2 --output .mlf-build/c3-delayed-index-20261101/ci-controls
      - name: Check fresh survivor merge against frozen C3 and independent model
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 .mlf-build/c3-survivors-guard python3 -B tools/testing/run.py --inherit-process-group fresh-survivors -- --producer .mlf-build/shared-ghc --producer-source "$PWD" --optimization 2 --output .mlf-build/c3-survivors-20261101/ci-controls
      - name: Check private projection views against frozen session and independent model
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/testing/run.py python-full-compiler-contract
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 .mlf-build/full-compiler-guard python3 -B tools/testing/run.py --inherit-process-group private-projection-views -- --producer .mlf-build/shared-ghc --producer-source "$PWD" --optimization 2 --output .mlf-build/full-compiler-20261101/ci-controls
      - name: Check compact Unicode indexing against frozen host and independent scalar oracle
        if: matrix.optimization == '2'
        run: |
          python3 -B tools/testing/run.py python-llvm-memory-contract
          python3 -B tools/testing/run.py python-llvm-memory-contract --python-optimization
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 .mlf-build/llvm-memory-guard python3 -B tools/testing/run.py --inherit-process-group llvm-unicode-memory -- --producer .mlf-build/shared-ghc --optimization 2 --output .mlf-build/llvm-memory-20261102/ci-controls
      - name: Check shared-value specialization admission and lazy semantics
        if: matrix.optimization == '2'
        run: python3 -B tools/testing/run.py common-calls -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/common-calls
      - name: Check callback code sharing and capture identity boundaries
        if: matrix.optimization == '2'
        run: python3 -B tools/testing/run.py callback-sharing -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/callback-sharing
      - name: Check lazy IO action specialization with native execution
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          sudo apt-get install -y libgc-dev
          prefix="$PWD/.mlf-build/io-action-gc"
          mkdir -p "$prefix/include" "$prefix/lib"
          cp /usr/include/gc.h "$prefix/include/gc.h"
          cp -R /usr/include/gc "$prefix/include/gc"
          archive="$(cc -print-file-name=libgc.a)"
          test -f "$archive"
          cp "$archive" "$prefix/lib/libgc.a"
          dpkg-query -W libgc-dev > "$prefix/dependency-version.txt"
          python3 -B tools/testing/run.py io-action-sharing -- --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/io-action-sharing --clang clang --gc-prefix "$prefix"
      - name: Check binary artifact codecs and real native storage
