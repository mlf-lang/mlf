name: CI
on:
  workflow_dispatch:
    inputs:
      source:
        description: Exact committed source to qualify
        type: string
        required: true
      seed_run:
        description: Successful portable LLVM producer with identical MLF inputs
        type: string
        required: true
permissions:
  contents: read
  actions: read
concurrency:
  group: windows-release-check-${{ github.sha }}
  cancel-in-progress: false
jobs:
  windows:
    name: Windows candidate qualification
    runs-on: windows-2025
    timeout-minutes: 360
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.source }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: portable-llvm
          path: .mlf-build/portable-llvm
          run-id: ${{ inputs.seed_run }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: mac-candidate
          path: .mlf-build/seed-provenance
          run-id: ${{ inputs.seed_run }}
          github-token: ${{ github.token }}
      - name: Verify identical MLF source inputs before using portable LLVM
        env:
          EXPECTED_SOURCE: ${{ inputs.source }}
          SEED_RUN: ${{ inputs.seed_run }}
        run: |
          . ./tools/release/windows-common.ps1
          $root = (Get-Location).Path
          Assert-Release ((git rev-parse HEAD).Trim() -eq $env:EXPECTED_SOURCE) 'Unexpected qualification source'
          $build = Read-ReleaseJson .mlf-build/seed-provenance/build-report.json
          Assert-Release ($build.complete -eq $true -and $build.implementation -eq 'MLF') 'Incomplete portable LLVM producer'
          foreach ($package in $build.packages.packages) {
            $packageRoot = Join-Path $root $package.path
            Assert-Release ((Get-ReleaseHash "$packageRoot/mlf-package.json") -eq $package.manifest) "Seed manifest differs: $packageRoot"
            foreach ($entry in $package.sources.GetEnumerator()) {
              Assert-Release ((Get-ReleaseHash (Join-Path $packageRoot $entry.Key)) -eq $entry.Value) "Seed MLF source differs: $($entry.Key)"
            }
          }
          Write-ReleaseJson .mlf-build/seed-provenance/source-equivalence.json @{source=$env:EXPECTED_SOURCE;seed_run=$env:SEED_RUN;mlf_inputs_identical=$true;runtime='compiled afresh from qualification source; no runtime reuse'}
      - name: Install pinned native Windows dependencies
        run: tools/release/setup-windows.ps1 -Output .mlf-build/windows-dependencies
      - name: Build two fresh native Windows generations
        run: tools/release/bootstrap-windows-release.ps1 -Seed .mlf-build/portable-llvm -NativePrefix $env:MLF_NATIVE_PREFIX -Clang $env:MLF_CLANG -Output .mlf-build/windows-native
      - name: Qualify exact tools and source
        run: tools/release/qualify-windows.ps1 -Stage1 .mlf-build/windows-native/stage1 -Stage2 .mlf-build/windows-native/stage2 -NativePrefix $env:MLF_NATIVE_PREFIX -Clang $env:MLF_CLANG -Output .mlf-build/windows-evidence
      - name: Package and relocate the candidate
        run: tools/release/package-windows.ps1 -Build .mlf-build/windows-native/stage2 -NativePrefix $env:MLF_NATIVE_PREFIX -Evidence .mlf-build/windows-evidence -Clang $env:MLF_CLANG -Output .mlf-build/windows-release
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-candidate-diagnostics
          include-hidden-files: true
          path: |
            .mlf-build/seed-provenance/*.json
            .mlf-build/windows-evidence/**/*.json
            .mlf-build/windows-evidence/**/*.log
            .mlf-build/windows-evidence/**/*.err
            .mlf-build/windows-evidence/**/*.stderr
            .mlf-build/windows-native/**/*.json
            .mlf-build/windows-native/*.log
            .mlf-build/windows-release/smoke-work/**/*.json
            .mlf-build/windows-release/*.log
          retention-days: 14
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-qualified-candidate
          path: .mlf-build/windows-release/*.zip
          retention-days: 14
