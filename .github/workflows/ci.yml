name: CI
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Run all native qualification campaigns and the complete Benchmark Game
        type: boolean
        default: false
      self_host:
        description: Run complete qualification (includes the fresh self-host fixed point)
        type: boolean
        default: false
      windows_runtime_only:
        description: Run only the native Windows runtime regressions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Frozen migration oracles require their exact Git history.
      - run: tools/release/check.sh
      - name: Verify unit evidence with jq 1.8.2
        run: |
          set -euo pipefail
          jq --version
          mkdir -p "$RUNNER_TEMP/jq-1.8.2"
          curl -fsSL https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64 -o "$RUNNER_TEMP/jq-1.8.2/jq"
          printf '%s  %s\n' b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f "$RUNNER_TEMP/jq-1.8.2/jq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/jq-1.8.2/jq"
          test "$("$RUNNER_TEMP/jq-1.8.2/jq" --version)" = jq-1.8.2
          PATH="$RUNNER_TEMP/jq-1.8.2:$PATH" tools/release/test-unit-evidence.sh
      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
  native:
    # Preserve the required-check job ID, but label the producer honestly.
    name: Shared compiler source smoke (GHC O${{ matrix.optimization }}, ${{ matrix.suite }})
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        # Keep the same O0 assertions, but bound the direct/default/framework
        # work independently. O2 retains the original complete sequence.
        include:
          - optimization: '2'
            suite: all
          - optimization: '0'
            suite: direct
          - optimization: '0'
            suite: default
          - optimization: '0'
            suite: framework
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # The framework oracle reads frozen Git fixtures.
      - name: Install pinned direct-host GHC 9.14.1
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libgc-dev libgmp-dev libnuma-dev libncurses-dev pkg-config xz-utils
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          curl -fsSL https://downloads.haskell.org/~ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz -o "$archive"
          printf '%s  %s\n' 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ghc-9.14.1-x86_64-unknown-linux" && ./configure --prefix="$RUNNER_TEMP/ghc" && make install)
          test "$("$RUNNER_TEMP/ghc/bin/ghc" --numeric-version)" = 9.14.1
          echo "$RUNNER_TEMP/ghc/bin" >> "$GITHUB_PATH"
      # Each shard intentionally pays for its own toolchain and producer build.
      # Authentication binds absolute toolchain, host, object, and command-log
      # paths; copying/rebasing receipts would weaken that provenance contract.
      - name: Build exact committed shared sources and direct test runners
        run: |
          python3 tools/shared/build.py --bootstrap-only --optimization '${{ matrix.optimization }}' --build-dir .mlf-build/shared-ghc
          jq -e '.complete == true and .producer_host == "GHC" and .typecheck_only == false' .mlf-build/shared-ghc/receipt.json
      # Low-cost coverage for the compiler shape benchmark, placed directly after
      # the producer so it runs before the long suites: the contract test proves
      # the analyzer refuses bad data, and the smoke matrix performs real
      # same-source GHC/MLF compilations with a fresh target on every leg. The
      # complete 10 x 3 matrix stays a manual, dedicated workflow run.
      - name: Check compiler shape benchmark contract
        if: matrix.suite == 'all' && matrix.optimization == '2'
        run: python3 -B tools/performance/compiler-shapes/test_contract.py
      - name: Compiler shape smoke (GHC vs MLF, 18 timed compilations)
        if: matrix.suite == 'all' && matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/performance/compiler-shapes/bench.py all \
            --workdir .mlf-build/compiler-shapes-smoke --cohort smoke --matrix smoke \
            --producer .mlf-build/shared-ghc --build-builtin
      - name: Check Int64 arithmetic and Patricia boundaries
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/performance/patricia/test_adapters.py
          python3 -O -B tools/performance/patricia/test_adapters.py
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-focused-guard python3 -B tools/performance/patricia/run_controls.py --reference-source "$PWD" --reference-producer .mlf-build/shared-ghc --output .mlf-build/patricia-focused
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-design-guard python3 -B tools/performance/patricia/run_design_controls.py --reference-source "$PWD" --reference-producer .mlf-build/shared-ghc --output .mlf-build/patricia-design
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-native-guard python3 -B tools/performance/patricia/run_native.py --producer .mlf-build/shared-ghc --output .mlf-build/patricia-native --mode standalone
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/llp64-guard python3 -B tools/performance/int64/run_llp64.py --producer .mlf-build/shared-ghc --output .mlf-build/llp64-controls
          for suite in host native legacy; do
            python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 ".mlf-build/int64-$suite-guard" python3 -B tools/performance/int64/run_controls.py --suite "$suite" --producer .mlf-build/shared-ghc --output ".mlf-build/int64-$suite" --gc-prefix /usr --gmp-prefix /usr --gc-library "$(pkg-config --variable=libdir bdw-gc)/libgc.a"
          done
      - name: Check finite P1-P3, A1 and F1 correctness
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/crate-optimization-guard python3 -B tools/performance/patricia/run_integrated.py --suite p123 --producer .mlf-build/shared-ghc --output .mlf-build/crate-optimization-controls
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/a1-integrated-guard python3 -B tools/performance/patricia/run_integrated.py --suite graph --producer .mlf-build/shared-ghc --output .mlf-build/a1-integrated-controls
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/f1-integrated-guard python3 -B tools/performance/patricia/run_fingerprint.py --producer .mlf-build/shared-ghc --output .mlf-build/f1-integrated-controls
      - name: Check Map balance tree and demand semantics
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/map-balance-guard python3 -B tools/performance/patricia/run_integrated.py --suite map-balance --producer .mlf-build/shared-ghc --output .mlf-build/map-balance-controls
      - name: Check generated graph validation boundary
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B -m unittest discover -s tools/performance/validation-reuse -p 'test_*.py'
          python3 -B -O -m unittest discover -s tools/performance/validation-reuse -p 'test_*.py'
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/validation-reuse-guard python3 -B tools/performance/patricia/run_integrated.py --suite validation --producer .mlf-build/shared-ghc --output .mlf-build/validation-reuse-controls
      - name: Check canonical builtin and retained file cases
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-builtin-guard python3 -B tools/performance/patricia/run_integrated.py --suite builtin --producer .mlf-build/shared-ghc --output .mlf-build/patricia-builtin-controls
          python3 -B tools/shared/resource_watchdog.py --seconds 1800 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 4096 .mlf-build/patricia-files-guard python3 -B tools/performance/patricia/run_file_controls.py --reference-source "$PWD" --reference-producer .mlf-build/shared-ghc --producer .mlf-build/shared-ghc --builtin-prefix .mlf-build/patricia-builtin-controls/builtin --output .mlf-build/patricia-file-controls
      - name: Execute the actual shared suite-receipt helpers
        if: matrix.suite == 'all' || matrix.suite == 'direct'
        run: |
          python3 tools/release/test-suite-build-receipts.py --executable .mlf-build/shared-ghc/bin/build-receipts --output .mlf-build/suite-receipt-regression
      - name: Execute source-bound shared smoke runner
        if: matrix.suite == 'all' || matrix.suite == 'direct'
        env:
          MLF_SOURCE_SMOKE_RUNNER: .mlf-build/shared-ghc/bin/source-smoke
          MLF_SOURCE_SMOKE_RECEIPT: .mlf-build/shared-ghc/receipt.json
        run: tools/release/source-smoke.sh
      - name: Qualify authenticated direct async and frontend execution
        if: matrix.suite == 'all' || matrix.suite == 'direct'
        run: |
          set -euo pipefail
          python3 tools/shared/test_direct.py --bin-dir .mlf-build/shared-ghc/bin \
            --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/direct-host-tests
          # The default/all framework gate executes this same no-argument
          # TupleList binary with its exact 305-observation completion oracle.
      - name: Qualify authenticated TupleList default and framework semantics
        if: matrix.suite != 'direct'
        run: |
          # CI164 framework used 4455.57s; CI167 default reached 302/305 at4500s.
          # Both O0 suites use the existing bounded override; O2 stays unchanged.
          suite_args=()
          if [ '${{ matrix.optimization }}:${{ matrix.suite }}' = '0:framework' ] || [ '${{ matrix.optimization }}:${{ matrix.suite }}' = '0:default' ]; then
            suite_args=(--suite-timeout 5400)
          fi
          python3 tools/shared/test_framework_direct.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/framework-direct --suite '${{ matrix.suite }}' ${suite_args[@]+"${suite_args[@]}"}
      - name: Qualify exact maintained Figure12 fixtures
        if: matrix.suite == 'all' || matrix.suite == 'direct'
        run: |
          python3 tools/shared/test_figure12_direct.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/figure12-direct
      - name: Check recursive managed evidence and source-group contracts
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_recursive_managed.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/recursive-managed
      - name: Check known parameter-field projection graph invariants
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_parameter_field_graph.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/parameter-field-graph
      - name: Check source field normalization and exact imported layouts
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_source_field_layouts.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/source-field-layouts
      - name: Check shared-value specialization admission and lazy semantics
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_common_calls.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/common-calls
      - name: Check callback code sharing and capture identity boundaries
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_callback_sharing.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/callback-sharing
      - name: Check lazy IO action specialization with native execution
        if: matrix.optimization == '2'
        run: |
          set -euo pipefail
          sudo apt-get install -y libgc-dev
          prefix="$PWD/.mlf-build/io-action-gc"
          mkdir -p "$prefix/include" "$prefix/lib"
          cp /usr/include/gc.h "$prefix/include/gc.h"
          cp -R /usr/include/gc "$prefix/include/gc"
          archive="$(cc -print-file-name=libgc.a)"
          test -f "$archive"
          cp "$archive" "$prefix/lib/libgc.a"
          dpkg-query -W libgc-dev > "$prefix/dependency-version.txt"
          python3 tools/shared/test_io_action_sharing.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/io-action-sharing --clang clang --gc-prefix "$prefix"
      - name: Check fixed native library boundaries and lazy exports
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_native_library.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/native-library --clang clang --gc-prefix .mlf-build/io-action-gc
      - name: Build and check the default installed standard library
        if: matrix.optimization == '2' && matrix.suite == 'all'
        run: |
          set -euo pipefail
          sudo apt-get install -y pkg-config
          PYTHONDONTWRITEBYTECODE=1 python3 -B tools/shared/build.py --optimization 2 --build-dir .mlf-build/stdlib-default
          PYTHONDONTWRITEBYTECODE=1 python3 -B .mlf-build/stdlib-default/sources/tools/shared/test_native_library.py \
            --build-receipt .mlf-build/stdlib-default/receipt.json \
            --output .mlf-build/stdlib-default-controls --clang clang --gc-prefix .mlf-build/io-action-gc \
            --frontend-source-root .mlf-build/stdlib-default/sources/libraries/mlf-foundation
      - name: Check actual MLF mixed-framework source acceptance
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_guest_framework.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/guest-framework-source
      - name: Check actual-import guest Graph and Oracle laws
        if: matrix.optimization == '2'
        run: python3 tools/shared/test_guest_state_laws.py --build-receipt .mlf-build/shared-ghc/receipt.json --output .mlf-build/guest-state-laws
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: source-smoke-evidence-ghc-O${{ matrix.optimization }}-${{ matrix.suite }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/shared-ghc/receipt.json
            .mlf-build/shared-ghc/*.log
            .mlf-build/shared-ghc/packages.txt
            .mlf-build/compiler-shapes-smoke/setup/setup.json
            .mlf-build/compiler-shapes-smoke/setup/*.json
            .mlf-build/compiler-shapes-smoke/cohorts/**/*.json
            .mlf-build/compiler-shapes-smoke/cohorts/**/*.csv
            .mlf-build/compiler-shapes-smoke/cohorts/**/*.md
            .mlf-build/compiler-shapes-smoke/cohorts/**/stdout
            .mlf-build/compiler-shapes-smoke/cohorts/**/stderr
            .mlf-build/compiler-shapes-smoke/results/
            .mlf-build/crate-optimization-guard/
            .mlf-build/crate-optimization-controls/**/*.json
            .mlf-build/crate-optimization-controls/**/*.stdout
            .mlf-build/crate-optimization-controls/**/*.stderr
            .mlf-build/a1-integrated-guard/
            .mlf-build/a1-integrated-controls/**/*.json
            .mlf-build/a1-integrated-controls/**/*.stdout
            .mlf-build/a1-integrated-controls/**/*.stderr
            .mlf-build/f1-integrated-guard/
            .mlf-build/validation-reuse-guard/
            .mlf-build/validation-reuse-controls/**/*.json
            .mlf-build/validation-reuse-controls/**/stdout
            .mlf-build/validation-reuse-controls/**/stderr
            .mlf-build/validation-reuse-controls/**/*.hs
            .mlf-build/crate-optimization-controls/**/stdout
            .mlf-build/crate-optimization-controls/**/stderr
            .mlf-build/crate-optimization-controls/**/*.hs
            .mlf-build/a1-integrated-controls/**/stdout
            .mlf-build/a1-integrated-controls/**/stderr
            .mlf-build/a1-integrated-controls/**/*.hs
            .mlf-build/f1-integrated-controls/**/stdout
            .mlf-build/f1-integrated-controls/**/stderr
            .mlf-build/f1-integrated-controls/**/*.hs
            .mlf-build/map-balance-controls/**/stdout
            .mlf-build/map-balance-controls/**/stderr
            .mlf-build/map-balance-controls/**/*.hs
            .mlf-build/map-balance-guard/
            .mlf-build/map-balance-controls/**/*.json
            .mlf-build/patricia-*/**/*.json
            .mlf-build/patricia-*/**/stdout
            .mlf-build/patricia-*/**/stderr
            .mlf-build/patricia-*/**/*.hs
            .mlf-build/int64-*/**/*.json
            .mlf-build/int64-*/**/stdout
            .mlf-build/int64-*/**/stderr
            .mlf-build/int64-*/**/*.hs
            .mlf-build/llp64-*/**/*.json
            .mlf-build/llp64-*/**/stdout
            .mlf-build/llp64-*/**/stderr
            .mlf-build/llp64-*/**/*.hs
            .mlf-build/f1-integrated-controls/**/*.json
            .mlf-build/f1-integrated-controls/**/*.stdout
            .mlf-build/f1-integrated-controls/**/*.stderr
            .mlf-build/f1-integrated-controls/**/source/Probe.dump-*
            .mlf-build/f1-integrated-controls/actual-source/Separate.dump-*
            .mlf-build/source-smoke/*.log*
            .mlf-build/source-smoke/*.json
            .mlf-build/source-smoke/*.xmlf
            .mlf-build/suite-receipt-regression/
            .mlf-build/direct-host-tests/**/*.json
            .mlf-build/direct-host-tests/**/*.stdout
            .mlf-build/direct-host-tests/**/*.stderr
            .mlf-build/direct-host-tests/*.log
            .mlf-build/framework-direct/*.json*
            .mlf-build/framework-direct/*.stdout
            .mlf-build/framework-direct/*.stderr
            .mlf-build/figure12-direct/*.json
            .mlf-build/figure12-direct/*.stdout
            .mlf-build/figure12-direct/*.stderr
            .mlf-build/recursive-managed/*.json
            .mlf-build/recursive-managed/*.stdout
            .mlf-build/recursive-managed/*.stderr
            .mlf-build/source-field-layouts/*.json
            .mlf-build/source-field-layouts/*.stdout
            .mlf-build/source-field-layouts/*.stderr
            .mlf-build/parameter-field-graph/*.json
            .mlf-build/parameter-field-graph/*.stdout
            .mlf-build/parameter-field-graph/*.stderr
            .mlf-build/common-calls/**/*.json
            .mlf-build/common-calls/**/*.stdout
            .mlf-build/common-calls/**/*.stderr
            .mlf-build/io-action-gc/dependency-version.txt
            .mlf-build/io-action-sharing/**/*.json
            .mlf-build/io-action-sharing/**/*.stdout
            .mlf-build/io-action-sharing/**/*.stderr
            .mlf-build/io-action-sharing/**/*.ll
            .mlf-build/io-action-sharing/**/*.xmlf
            .mlf-build/guest-framework-source/**/*.json
            .mlf-build/guest-framework-source/**/*.log
            .mlf-build/guest-framework-source/**/*.stdout
            .mlf-build/guest-framework-source/**/*.stderr
            .mlf-build/guest-framework-source/**/*.spec
            .mlf-build/guest-state-laws/**/*.json
            .mlf-build/guest-state-laws/**/*.log
            .mlf-build/guest-state-laws/**/*.stdout
            .mlf-build/guest-state-laws/**/*.stderr
  build-runner:
    name: Native build runner (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    strategy:
      fail-fast: false
      matrix:
        # PR and merge-queue gates stay on Linux; main/manual runs retain macOS.
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-26"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile the native scheduler and lifecycle fixtures
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/.mlf-build/build-runner-ci"
          mkdir -p "$output"
          clang -O2 -std=c11 -Wall -Wextra -Werror runtime/mlf_build_runner.c -o "$output/mlf-build-runner"
          clang -O2 -std=c11 -Wall -Wextra -Werror tests/native/build_runner_fixture.c -o "$output/build-runner-fixture"
          clang -O2 -std=c11 -Wall -Wextra -Werror tests/native/build_runner_tests.c -o "$output/build-runner-tests"
          clang -O2 -std=c11 -Wall -Wextra -Werror tests/native/process_supervisor_tests.c runtime/mlf_process_supervisor.c -o "$output/process-supervisor-tests"
      - name: Exercise bounded scheduling, protocols, and descendant cleanup
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/.mlf-build/build-runner-ci"
          "$output/build-runner-tests" "$output/mlf-build-runner" "$output/build-runner-fixture" "$output/evidence" 2>&1 | tee "$output/build-runner.log"
          grep -q '22 native build runner tests passed' "$output/build-runner.log"
          "$output/process-supervisor-tests" "$output/build-runner-fixture" "$output/process-evidence" 2>&1 | tee "$output/process-supervisor.log"
          grep -q 'native process supervisor tests passed' "$output/process-supervisor.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: build-runner-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .mlf-build/build-runner-ci/*.log
            .mlf-build/build-runner-ci/evidence/**/*.plan
            .mlf-build/build-runner-ci/evidence/**/*.result
  async-runtime:
    name: Native async completions (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    strategy:
      fail-fast: false
      matrix:
        # Keep real macOS coverage without queueing the required pre-merge gate.
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-26"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native runtime test dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libgc-dev libgmp-dev pkg-config
          else
            brew install bdw-gc gmp pkg-config
          fi
      - name: Exercise traced completions, primitive dispatch, and timers
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/.mlf-build/async-native-ci"
          mkdir -p "$output"
          read -r -a cflags <<< "$(pkg-config --cflags bdw-gc gmp)"
          read -r -a libs <<< "$(pkg-config --libs bdw-gc gmp)"
          for test in completion_cell_tests async_completion_primitives; do
            clang -O2 -std=c11 -Wall -Wextra -Werror "${cflags[@]}" "tests/native/$test.c" runtime/mlf_runtime.c "${libs[@]}" -lm -o "$output/$test"
            "$output/$test" 2>&1 | tee "$output/$test.log"
          done
          grep -q 'Native completion representation: .* checks, .* callbacks passed' "$output/completion_cell_tests.log"
          grep -q 'Native completion primitives: .* checks, .* callbacks passed' "$output/async_completion_primitives.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: async-native-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: .mlf-build/async-native-ci/*.log
  async-language:
    name: Async interpreter and native parity (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'push' || github.event_name == 'workflow_dispatch') && '["ubuntu-24.04", "macos-26"]' || '["ubuntu-24.04"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Decide whether expensive async parity was explicitly requested
        id: scope
        run: python3 tools/release/async-change-scope.py --output .mlf-build/async-change-scope/decision.json
      - name: Native bootstrap and parity dependencies
        if: steps.scope.outputs.required != 'false'
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y clang llvm libgmp-dev libgc-dev pkg-config jq
          else
            brew install llvm gmp pkg-config bdw-gc jq
            echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
            echo "MLF_GC_PREFIX=$(brew --prefix bdw-gc)" >> "$GITHUB_ENV"
          fi
          echo 'GC_FREE_SPACE_DIVISOR=8' >> "$GITHUB_ENV"
      - name: Fetch verified native seed
        if: steps.scope.outputs.required != 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=.github/smoke-seed.env
          if [ "$RUNNER_OS" = Linux ]; then pin=.github/smoke-seed-linux.env; fi
          tools/release/fetch-seed.sh .mlf-build/async-seed "$pin"
      - name: Bootstrap released seed through frozen bridge to shared native tools
        if: steps.scope.outputs.required != 'false'
        run: |
          set -euo pipefail
          mkdir -p .mlf-build/async-bootstrap
          scripts/bootstrap-async.sh 2>&1 | tee .mlf-build/async-bootstrap/bootstrap.log
      - name: Qualify typed completions and structured process tasks
        if: steps.scope.outputs.required != 'false'
        run: |
          set -euo pipefail
          compiler="$PWD/.mlf-build/async-bootstrap/stage2"
          EMLF="$compiler" tests/fixtures/async-completion/check.sh
          tools/release/test-async-process.sh "$compiler" .mlf-build/async-process-parity
          tools/release/test-async-task.sh "$compiler" .mlf-build/async-task-parity
          jq -e '.complete == true and .backends == ["source-interpreter", "target-interpreter", "llvm"]' .mlf-build/async-completion-gate/result.json
          for suite in async-process-parity async-task-parity; do
            jq -e '.complete == true and .backends == ["interpreter", "llvm"]' ".mlf-build/$suite/result.json"
          done
      - name: Qualify checked async package interfaces and cache replay
        if: steps.scope.outputs.required != 'false'
        run: |
          set -euo pipefail
          compiler="$PWD/.mlf-build/async-bootstrap/stage2"
          manager="$(cat .mlf-build/async-bootstrap/manager.path)"
          tools/release/test-async-package.sh "$compiler" "$manager" .mlf-build/async-package-parity
          jq -e '.complete == true and .backend == "llvm" and .cache_replay == true and .opaque_rejections == 6 and .type_rejections == 1' \
            .mlf-build/async-package-parity/result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: async-language-evidence-${{ matrix.os }}
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/async-change-scope/decision.json
            .mlf-build/async-bootstrap/bootstrap.log
            .mlf-build/async-bootstrap/bootstrap.json
            .mlf-build/async-bootstrap/shared-inputs.*.sha256
            .mlf-build/async-bootstrap/source-contract.json
            .mlf-build/async-bootstrap/bridge-source-identity.txt
            .mlf-build/async-bootstrap/bridge-identity.txt
            .mlf-build/async-bootstrap/implementation-identity.txt
            .mlf-build/async-bootstrap/completion-capability.txt
            .mlf-build/async-bootstrap/compiler.path
            .mlf-build/async-bootstrap/native/build-report.json
            .mlf-build/async-bootstrap/native/commands/
            .mlf-build/async-bootstrap/native-cache/*/artifact.json
            .mlf-build/async-bootstrap/bridge/build-*/**/build-report.json
            .mlf-build/async-bootstrap/bridge/build-*/**/commands/
            .mlf-build/async-bootstrap/bridge/*.sha256
            .mlf-build/async-bootstrap/bridge/*.txt
            .mlf-build/async-bootstrap/bridge/cache/*/artifact.json
            .mlf-build/async-bootstrap/bridge-source-*/bridge-inputs.sha256
            .mlf-build/async-bootstrap/capability.txt
            .mlf-build/async-bootstrap/source-identity.txt
            .mlf-build/async-bootstrap/compilers.sha256
            .mlf-build/async-bootstrap/manager.sha256
            .mlf-build/async-bootstrap/manager.path
            .mlf-build/async-bootstrap/build-*/**/build-report.json
            .mlf-build/async-bootstrap/build-*/**/commands/
            .mlf-build/async-bootstrap/source-*/inputs.sha256
            .mlf-build/async-bootstrap/cache/*/artifact.json
            .mlf-build/async-completion-gate/**/*.json
            .mlf-build/async-completion-gate/**/*.stdout
            .mlf-build/async-completion-gate/**/*.stderr
            .mlf-build/async-completion-gate/**/*.status
            .mlf-build/async-completion-gate/**/*.timed-out
            .mlf-build/async-process-parity/**/*.json
            .mlf-build/async-process-parity/**/*.stdout
            .mlf-build/async-process-parity/**/*.stderr
            .mlf-build/async-process-parity/**/*.status
            .mlf-build/async-process-parity/**/*.timed-out
            .mlf-build/async-task-parity/**/*.json
            .mlf-build/async-task-parity/**/*.stdout
            .mlf-build/async-task-parity/**/*.stderr
            .mlf-build/async-task-parity/**/*.status
            .mlf-build/async-task-parity/**/*.timed-out
            .mlf-build/async-package-parity/**/*.json
            .mlf-build/async-package-parity/**/*.stdout
            .mlf-build/async-package-parity/**/*.stderr
            .mlf-build/async-package-parity/**/*.status
            .mlf-build/async-package-parity/**/*.timed-out
  windows-runtime:
    name: Native Windows runtime
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned native Windows dependencies
        run: tools/release/setup-windows.ps1 -Output .mlf-build/windows-dependencies
      - name: Test native runtime, filesystem, and build runner lifecycles
        run: tools/release/test-windows-runtime.ps1 -NativePrefix $env:MLF_NATIVE_PREFIX -Clang $env:MLF_CLANG -Output .mlf-build/windows-runtime
      - name: Require long-path regression to reject the pre-fix runner
        run: |
          $ErrorActionPreference = 'Stop'
          . ./tools/release/windows-common.ps1
          # Original e7da00f201bfb66bf6e26d59e56184dd37a83abd, mapped after reviewed history cleanup.
          $baseline = 'bf38dc538598a0389a3310fe26c16f6609c912fc'
          git fetch --no-tags --depth=1 origin $baseline
          Assert-Release ($LASTEXITCODE -eq 0) 'Cannot fetch the immutable pre-fix runner'
          $source = git show "${baseline}:runtime/mlf_build_runner.c"
          Assert-Release ($LASTEXITCODE -eq 0) 'Cannot read the immutable pre-fix runner'
          $output = [IO.Path]::GetFullPath('.mlf-build/windows-runtime')
          $oldSource = "$output/pre-fix-build-runner.c"
          [IO.File]::WriteAllText($oldSource, ($source -join "`n") + "`n", [Text.UTF8Encoding]::new($false))
          $expectedOldSource = 'fce82f0710edd910557956a2225f211f195f10b69e95c3676d86bb01fd2f6abd'
          Assert-Release ((Get-FileHash -Algorithm SHA256 $oldSource).Hash.ToLowerInvariant() -eq $expectedOldSource) 'Pre-fix runner differs from the independently pinned source'
          $oldRunner = "$output/pre-fix-build-runner.exe"
          $flags = @('-O2','-std=c11','-Wall','-Wextra','-Werror','-municode',"-I$PWD/runtime",$oldSource,'-lpsapi','-o',$oldRunner)
          $null = Invoke-ReleaseCommand $env:MLF_CLANG $flags "$output/pre-fix-build-runner-build.log" $PWD.Path
          $negative = "$output/build-runner/negative-control"
          Assert-Release (!(Test-Path -LiteralPath $negative)) 'Negative control needs a fresh directory'
          $rejected = $false
          try {
            $null = Invoke-ReleaseCommand "$output/build-runner-tests.exe" @($oldRunner,"$output/build-runner-fixture.exe",$negative) "$output/long-path-negative.log" $PWD.Path
          } catch { $rejected = $true }
          Assert-Release $rejected 'Regression unexpectedly accepted the pre-fix runner'
          $results = @(Get-ChildItem -Path "$negative/build-runner-*/long-redirections.result" -File)
          Assert-Release ($results.Count -eq 1) 'Missing unique long-path negative result'
          $result = Read-ReleaseJson $results[0].FullName
          Assert-Release ($result.complete -eq $true -and $result.exit_code -eq 126) 'Negative control did not reach the expected launch failure'
          $task = @($result.tasks | Where-Object { $_.id -eq 'absolute' })
          Assert-Release ($task.Count -eq 1 -and $task[0].state -eq 'failed' -and $task[0].exit_code -eq 126 -and $task[0].pid -eq 0) 'Negative control failed for a different reason'
          Write-ReleaseJson "$output/long-path-negative.json" @{passed=$true;baseline=$baseline;pre_fix_runner_sha256=(Get-ReleaseHash $oldRunner);result=$result}
          Write-Output 'Pre-fix runner rejected long stream paths with exit 126 and PID 0'
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-runtime-evidence
          include-hidden-files: true
          path: |
            .mlf-build/windows-runtime/*.json
            .mlf-build/windows-runtime/*.log
            .mlf-build/windows-runtime/build-runner/**/*.plan
            .mlf-build/windows-runtime/build-runner/**/*.result
  pr-gate:
    # A skipped manual job must not satisfy the required check on the same SHA.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI summary' || 'PR gate' }}
    if: always() && github.event_name != 'workflow_dispatch'
    # The native dependency covers every matrix leg, including all three O0 shards.
    needs: [metadata, native, windows-runtime, build-runner, async-runtime, async-language]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every merge check to succeed
        env:
          CHECKS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$CHECKS" | jq -e 'length == 6 and all(.[]; .result == "success")'
  qualification:
    name: Complete main qualification
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.full_validation || inputs.self_host))) && !inputs.windows_runtime_only
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/native-qualification.yml
    with:
      source: ${{ github.sha }}
      build_packages: false
