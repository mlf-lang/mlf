name: CI
on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      full_validation:
        description: Also build fresh native tools and run the full package distribution suite
        type: boolean
        default: false
      self_host:
        description: Also rebuild the compiler and check a fresh self-host fixed point
        type: boolean
        default: false
      windows_runtime_only:
        description: Run only the native Windows runtime regressions
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  metadata:
    name: Release metadata
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: tools/release/check.sh
      - name: Validate GitHub Actions workflows
        run: |
          set -euo pipefail
          curl -fsSL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8 "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -shellcheck= -pyflakes=
  native:
    name: Compiler source smoke
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Published seed runtime dependency
        run: brew install gmp
      - name: Fetch verified native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/fetch-seed.sh .mlf-build/seed .github/smoke-seed.env
      - name: Exercise checkout compiler sources with the verified seed
        run: tools/release/native-ci.sh source-smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: source-smoke-evidence
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/source-smoke/result.json
            .mlf-build/source-smoke/*.log*
            .mlf-build/source-smoke/*.json
            .mlf-build/source-smoke/*.xmlf
  fresh-native:
    name: Fresh native compiler smoke
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)) && !inputs.windows_runtime_only
    needs: [native]
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native dependencies
        run: brew install llvm gmp pkg-config bdw-gc
      - name: Fetch verified native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/fetch-seed.sh .mlf-build/seed .github/smoke-seed.env
      - name: Build checkout tools and run small CLI smoke suite
        run: tools/release/native-ci.sh pr-smoke
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: pr-smoke-evidence
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/pr-smoke/result.json
            .mlf-build/pr-smoke/*.log
            .mlf-build/pr-smoke/manager-bootstrap/bootstrap.json
            .mlf-build/pr-smoke/manager-bootstrap/build-report.json
            .mlf-build/pr-smoke/manager-bootstrap/root-manifest.json
            .mlf-build/pr-smoke/manager-bootstrap/source/mlf-package.json
            .mlf-build/pr-smoke/manager-bootstrap/commands/
            .mlf-build/pr-smoke/candidate/build-report.json
            .mlf-build/pr-smoke/candidate/invocations/**/*.json
            .mlf-build/pr-smoke/candidate/invocations/**/*.stdout
            .mlf-build/pr-smoke/candidate/invocations/**/*.stderr
            .mlf-build/pr-smoke/candidate/cache/*/artifact.json
            .mlf-build/pr-smoke/cli/**/*.json
            .mlf-build/pr-smoke/cli/**/*.stdout
            .mlf-build/pr-smoke/cli/**/*.stderr
            .mlf-build/pr-smoke/cli/**/*.status
            .mlf-build/pr-smoke/cli/**/*.timed-out
            .mlf-build/pr-smoke/packages/*.json
            .mlf-build/pr-smoke/packages/*.log*
            .mlf-build/pr-smoke/packages/*.stdout
            .mlf-build/pr-smoke/packages/*.stderr
            .mlf-build/pr-smoke/packages/*.expected
  packages:
    name: Native package distribution
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_validation)) && !inputs.windows_runtime_only
    needs: [native]
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native dependencies
        run: |
          brew install llvm gmp pkg-config bdw-gc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "MLF_GC_PREFIX=$(brew --prefix bdw-gc)" >> "$GITHUB_ENV"
      - name: Fetch pinned published package compiler
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/fetch-seed.sh .mlf-build/package-seed .github/package-seed.env
      - name: Build candidate manager and test campaign
        run: |
          tools/release/bootstrap-manager.sh .mlf-build/package-manager-bootstrap
          export MLF_PACKAGE_MANAGER="$PWD/.mlf-build/package-manager-bootstrap/bin/mlfpkg"
          "$MLF_PACKAGE_MANAGER" --compiler "$MLF_COMPILER" --runtime "$PWD/runtime/mlf_runtime.c" \
            --build-dir .mlf-build/package-tools --timeout 5400 --locked build --target mlfpkg --target compiler-tests
      - name: Test source packages and checked GitHub distribution
        run: |
          .mlf-build/package-tools/bin/compiler-tests packages --compiler "$MLF_COMPILER" \
            --manager "$PWD/.mlf-build/package-tools/bin/mlfpkg" \
            --build-dir .mlf-build/package-tests --cache-dir .mlf-build/package-tools/cache
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: package-distribution-evidence
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/package-manager-bootstrap/bootstrap.json
            .mlf-build/package-manager-bootstrap/build-report.json
            .mlf-build/package-manager-bootstrap/root-manifest.json
            .mlf-build/package-manager-bootstrap/source/mlf-package.json
            .mlf-build/package-manager-bootstrap/commands/
            .mlf-build/package-tools/build-report.json
            .mlf-build/package-tools/commands/
            .mlf-build/package-tools/cache/*/artifact.json
            .mlf-build/package-tests/verification.json
            .mlf-build/package-tests/*.log*
            .mlf-build/package-tests/*.stderr
            .mlf-build/package-tests/*.coverage.jsonl
            .mlf-build/package-tests/suite-build/build-report.json
            .mlf-build/package-tests/suite-build/commands/
            tests/golden/unit-inventory.json
  build-runner:
    name: Native build runner (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Compile the native scheduler and lifecycle fixtures
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/.mlf-build/build-runner-ci"
          mkdir -p "$output"
          clang -O2 -std=c11 -Wall -Wextra -Werror runtime/mlf_build_runner.c -o "$output/mlf-build-runner"
          clang -O2 -std=c11 -Wall -Wextra -Werror tests/native/build_runner_fixture.c -o "$output/build-runner-fixture"
          clang -O2 -std=c11 -Wall -Wextra -Werror tests/native/build_runner_tests.c -o "$output/build-runner-tests"
          clang -O2 -std=c11 -Wall -Wextra -Werror tests/native/process_supervisor_tests.c runtime/mlf_process_supervisor.c -o "$output/process-supervisor-tests"
      - name: Exercise bounded scheduling, protocols, and descendant cleanup
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/.mlf-build/build-runner-ci"
          "$output/build-runner-tests" "$output/mlf-build-runner" "$output/build-runner-fixture" "$output/evidence" 2>&1 | tee "$output/build-runner.log"
          grep -q '22 native build runner tests passed' "$output/build-runner.log"
          "$output/process-supervisor-tests" "$output/build-runner-fixture" "$output/process-evidence" 2>&1 | tee "$output/process-supervisor.log"
          grep -q 'native process supervisor tests passed' "$output/process-supervisor.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: build-runner-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: |
            .mlf-build/build-runner-ci/*.log
            .mlf-build/build-runner-ci/evidence/**/*.plan
            .mlf-build/build-runner-ci/evidence/**/*.result
  async-runtime:
    name: Native async completions (${{ matrix.os }})
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native runtime test dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then
            sudo apt-get update
            sudo apt-get install -y libgc-dev libgmp-dev pkg-config
          else
            brew install bdw-gc gmp pkg-config
          fi
      - name: Exercise traced completions, primitive dispatch, and timers
        shell: bash
        run: |
          set -euo pipefail
          output="$PWD/.mlf-build/async-native-ci"
          mkdir -p "$output"
          read -r -a cflags <<< "$(pkg-config --cflags bdw-gc gmp)"
          read -r -a libs <<< "$(pkg-config --libs bdw-gc gmp)"
          for test in completion_cell_tests async_completion_primitives; do
            clang -O2 -std=c11 -Wall -Wextra -Werror "${cflags[@]}" "tests/native/$test.c" runtime/mlf_runtime.c "${libs[@]}" -lm -o "$output/$test"
            "$output/$test" 2>&1 | tee "$output/$test.log"
          done
          grep -q 'Native completion representation: .* checks, .* callbacks passed' "$output/completion_cell_tests.log"
          grep -q 'Native completion primitives: .* checks, .* callbacks passed' "$output/async_completion_primitives.log"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: async-native-evidence-${{ matrix.os }}
          include-hidden-files: true
          path: .mlf-build/async-native-ci/*.log
  async-language:
    name: Async interpreter and native parity
    if: github.event_name != 'workflow_dispatch' || !inputs.windows_runtime_only
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Native bootstrap and parity dependencies
        run: |
          brew install llvm gmp pkg-config bdw-gc jq
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "MLF_GC_PREFIX=$(brew --prefix bdw-gc)" >> "$GITHUB_ENV"
          echo 'GC_FREE_SPACE_DIVISOR=8' >> "$GITHUB_ENV"
      - name: Fetch verified native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/fetch-seed.sh .mlf-build/async-seed .github/smoke-seed.env
      - name: Bootstrap the real primitive-aware interpreter and compiler
        run: |
          set -euo pipefail
          mkdir -p .mlf-build/async-bootstrap
          scripts/bootstrap-async.sh 2>&1 | tee .mlf-build/async-bootstrap/bootstrap.log
      - name: Qualify typed completions and structured process tasks
        run: |
          set -euo pipefail
          compiler="$PWD/.mlf-build/async-bootstrap/stage2"
          EMLF="$compiler" tests/fixtures/async-completion/check.sh
          tools/release/test-async-process.sh "$compiler" .mlf-build/async-process-parity
          tools/release/test-async-task.sh "$compiler" .mlf-build/async-task-parity
          jq -e '.complete == true and .backends == ["source-interpreter", "target-interpreter", "llvm"]' .mlf-build/async-completion-gate/result.json
          for suite in async-process-parity async-task-parity; do
            jq -e '.complete == true and .backends == ["interpreter", "llvm"]' ".mlf-build/$suite/result.json"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: async-language-evidence
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/async-bootstrap/bootstrap.log
            .mlf-build/async-bootstrap/capability.txt
            .mlf-build/async-bootstrap/source-identity.txt
            .mlf-build/async-bootstrap/compilers.sha256
            .mlf-build/async-bootstrap/manager.sha256
            .mlf-build/async-bootstrap/build-*/**/build-report.json
            .mlf-build/async-bootstrap/build-*/**/commands/
            .mlf-build/async-bootstrap/source-*/inputs.sha256
            .mlf-build/async-bootstrap/cache/*/artifact.json
            .mlf-build/async-completion-gate/**/*.json
            .mlf-build/async-completion-gate/**/*.stdout
            .mlf-build/async-completion-gate/**/*.stderr
            .mlf-build/async-completion-gate/**/*.status
            .mlf-build/async-completion-gate/**/*.timed-out
            .mlf-build/async-process-parity/**/*.json
            .mlf-build/async-process-parity/**/*.stdout
            .mlf-build/async-process-parity/**/*.stderr
            .mlf-build/async-process-parity/**/*.status
            .mlf-build/async-process-parity/**/*.timed-out
            .mlf-build/async-task-parity/**/*.json
            .mlf-build/async-task-parity/**/*.stdout
            .mlf-build/async-task-parity/**/*.stderr
            .mlf-build/async-task-parity/**/*.status
            .mlf-build/async-task-parity/**/*.timed-out
  windows-runtime:
    name: Native Windows runtime
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Install pinned native Windows dependencies
        run: tools/release/setup-windows.ps1 -Output .mlf-build/windows-dependencies
      - name: Test native runtime, filesystem, and build runner lifecycles
        run: tools/release/test-windows-runtime.ps1 -NativePrefix $env:MLF_NATIVE_PREFIX -Clang $env:MLF_CLANG -Output .mlf-build/windows-runtime
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: windows-runtime-evidence
          include-hidden-files: true
          path: |
            .mlf-build/windows-runtime/*.json
            .mlf-build/windows-runtime/*.log
            .mlf-build/windows-runtime/build-runner/**/*.plan
            .mlf-build/windows-runtime/build-runner/**/*.result
  pr-gate:
    # A skipped manual job must not satisfy the required check on the same SHA.
    name: ${{ github.event_name == 'workflow_dispatch' && 'Manual CI summary' || 'PR gate' }}
    if: always() && github.event_name != 'workflow_dispatch'
    needs: [metadata, native, windows-runtime, build-runner, async-runtime, async-language]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every merge check to succeed
        env:
          CHECKS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$CHECKS" | jq -e 'length == 6 and all(.[]; .result == "success")'
  self-host:
    name: Fresh self-host
    if: github.event_name == 'workflow_dispatch' && inputs.self_host && !inputs.windows_runtime_only
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: brew install llvm gmp pkg-config bdw-gc
      - name: Fetch verified native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/fetch-seed.sh .mlf-build/seed
      # A seed with an older code generator cannot itself produce fixed-point
      # LLVM for the updated compiler. Validate the next native generation.
      - name: Bootstrap the updated native code generator
        run: |
          export MLF_GC_PREFIX="$(brew --prefix bdw-gc)"
          export PATH="$(brew --prefix llvm)/bin:$PATH"
          tools/release/timed-bootstrap.sh
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: native-bootstrap-evidence
          include-hidden-files: true
          retention-days: 30
          path: |
            .mlf-build/bootstrap-stage1/build-report.json
            .mlf-build/bootstrap-stage1/commands/
            .mlf-build/bootstrap-stage1/cache/**/artifact.json
            .mlf-build/bootstrap-stage1/timing/
      - name: Build and check a fresh compiler fixed point
        run: tools/release/native-ci.sh self-host
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: native-self-host-evidence
          include-hidden-files: true
          path: |
            .mlf-build/build-report.json
            .mlf-build/compiler-tests/self-host/verification.json
