name: Native release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable version tag, matching VERSION (for example v0.1.1)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  tests:
    name: Native ${{ matrix.group }}
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        group: [unit, packages, self-host, parity, backends, port]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - name: Verify version tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          test "$RELEASE_TAG" = "v$(cat VERSION)"
          test "$(git describe --tags --exact-match HEAD)" = "$RELEASE_TAG"
          tools/release/check.sh
      - run: brew install llvm gmp pkg-config bdw-gc
      - name: Fetch verified native seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/fetch-seed.sh .mlf-build/seed
      - name: Run compiler test group
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: tools/release/native-ci.sh "$TEST_GROUP"
      - name: Collect candidate and primary evidence
        if: always()
        env:
          TEST_GROUP: ${{ matrix.group }}
        run: |
          mkdir -p .mlf-build/release-evidence/bin .mlf-build/release-evidence/compiler-tests
          cp .mlf-build/bin/emlf .mlf-build/bin/mlfpkg .mlf-build/release-evidence/bin/
          cp -R ".mlf-build/compiler-tests/$TEST_GROUP" .mlf-build/release-evidence/compiler-tests/
          find .mlf-build/release-evidence/compiler-tests -type f ! -name verification.json ! -name '*.log' -delete
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: native-${{ matrix.group }}
          include-hidden-files: true
          path: .mlf-build/release-evidence/
          retention-days: 14
  publish:
    name: Package and publish developer preview
    needs: tests
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
      - run: brew install llvm gmp pkg-config bdw-gc
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-*
          merge-multiple: true
          path: .mlf-build/release-input
      - name: Restore executable modes and assemble verified package
        run: |
          chmod +x .mlf-build/release-input/bin/*
          tools/release/package.sh .mlf-build/release-input .mlf-build/release tools/release/licenses/BDWGC.txt
      - name: Publish a new release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --title "MLF ${RELEASE_TAG#v} — developer preview" --notes-file CHANGELOG.md .mlf-build/release/*.tar.gz .mlf-build/release/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
