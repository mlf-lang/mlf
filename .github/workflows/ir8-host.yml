name: IR8 host checks
on:
  pull_request:
    paths:
      - 'tools/experimental/resource-native/**'
      - '.github/workflows/ir8-host.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir8-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ir8-host:
    name: Isolated IR8 host-only checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run bounded standalone host suites
        run: |
          python3 -B -S tools/experimental/resource-native/tests/run_ir8_host.py \
            --output "$RUNNER_TEMP/ir8-host"
      - name: Check registered nominal type arguments and metadata
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ir8-nominal-arguments-host"
          python3 -B -S tools/experimental/resource-native/tests/test_ir8_nominal_arguments.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-nominal-arguments-host/checks.log"
      - name: Check closed arrow type arguments and canonical metadata
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ir8-arrow-arguments-host"
          python3 -B -S tools/experimental/resource-native/tests/test_ir8_arrow_arguments.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-arrow-arguments-host/checks.log"
      - name: Check explicit scalar generic imports and copy equations
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ir8-generic-imports-host"
          python3 -B -S tools/experimental/resource-native/tests/test_ir8_generic_imports.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-generic-imports-host/checks.log"
      - name: Retain host-only evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ir8-host-evidence-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ir8-host
            ${{ runner.temp }}/ir8-nominal-arguments-host
            ${{ runner.temp }}/ir8-arrow-arguments-host
            ${{ runner.temp }}/ir8-generic-imports-host
          if-no-files-found: warn
          retention-days: 14
  ir8-runtime-host:
    name: IR8 emitter and directory-reader checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Run the standalone emitter suite
        run: |
          python=$(command -v python3)
          work="$RUNNER_TEMP/ir8-runtime-emit"
          mkdir -m 700 "$work" "$work/home" "$work/tmp"
          timeout --signal=TERM --kill-after=5s 180s env -i \
            PATH=/usr/bin:/bin LANG=C.UTF-8 LC_ALL=C.UTF-8 TZ=UTC \
            PYTHONDONTWRITEBYTECODE=1 PYTHONHASHSEED=0 \
            HOME="$work/home" TMPDIR="$work/tmp" \
            "$python" -B -S \
            "$GITHUB_WORKSPACE/tools/experimental/resource-native/tests/test_stage05_runtime_emit.py" \
            --evidence-root "$work/results"
      - name: Check bounded directory readers at O0 and O2
        run: |
          python3 -B tools/experimental/resource-native/tests/test_binding_readers.py \
            --cc cc --output "$RUNNER_TEMP/ir8-binding-readers"
      - name: Prepare a host-checked nested arrow and nominal-leaf guard pair
        run: |
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -B tools/experimental/resource-native/tests/prepare_nested_arrow_guard_fixture.py \
              --output "$RUNNER_TEMP/ir8-nested-arrow-fixture"
      - name: Check nested arrow packet and real-instantiation guards
        run: |
          timeout --signal=TERM --kill-after=5s 300s \
            python3 -B tools/experimental/resource-native/tests/test_arrow_argument_guards.py \
              --generated "$RUNNER_TEMP/ir8-nested-arrow-fixture" \
              --cc cc --output "$RUNNER_TEMP/ir8-nested-arrow-guards"
      - name: Prepare explicit scalar import and alias guard fixtures
        run: |
          timeout --signal=TERM --kill-after=5s 180s env PYTHONHASHSEED=0 \
            python3 -B tools/experimental/resource-native/tests/prepare_generic_capture_guard_fixtures.py \
              --output "$RUNNER_TEMP/ir8-generic-capture-fixtures"
      - name: Check pending APPLICATION and ready Bool capture guards
        run: |
          set -euo pipefail
          timeout --signal=TERM --kill-after=5s 300s \
            python3 -B tools/experimental/resource-native/tests/test_generic_capture_guards.py \
              --generated "$RUNNER_TEMP/ir8-generic-capture-fixtures/pending-int-application-aliases/generated" \
              --output "$RUNNER_TEMP/ir8-generic-pending-guards" --cc cc --expected-scalar 42 --require-pending
          timeout --signal=TERM --kill-after=5s 300s \
            python3 -B tools/experimental/resource-native/tests/test_generic_capture_guards.py \
              --generated "$RUNNER_TEMP/ir8-generic-capture-fixtures/ready-bool-aliases/generated" \
              --output "$RUNNER_TEMP/ir8-generic-ready-guards" --cc cc --expected-scalar 42
      - name: Retain emitter and reader evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ir8-runtime-emit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ir8-runtime-emit
            ${{ runner.temp }}/ir8-binding-readers
            ${{ runner.temp }}/ir8-nested-arrow-fixture
            ${{ runner.temp }}/ir8-nested-arrow-guards
            ${{ runner.temp }}/ir8-generic-capture-fixtures
            ${{ runner.temp }}/ir8-generic-pending-guards
            ${{ runner.temp }}/ir8-generic-ready-guards
          if-no-files-found: warn
          retention-days: 14
  ir8-native-runtime:
    name: Opt-in IR8 native runtime (${{ matrix.optimization }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        optimization: [O0, O2]
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Compile, link and test the real runtime
        run: |
          python3 -B tools/experimental/resource-native/tests/test_stage05_runtime_native.py \
            --output "$RUNNER_TEMP/ir8-native-runtime-${{ matrix.optimization }}" \
            --optimization "${{ matrix.optimization }}" --stress
      - name: Retain native evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ir8-native-runtime-${{ matrix.optimization }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ir8-native-runtime-${{ matrix.optimization }}
          if-no-files-found: warn
          retention-days: 14
  ir8-source-fragments:
    name: IR8 shared fragment and planner checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      CC: gcc
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Replay bounded source fragments
        run: |
          set -euo pipefail
          mkdir -m 700 "$RUNNER_TEMP/ir8-source-fragments"
          python3 -B tools/experimental/resource-native/tests/test_module_shared_transport.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/replay.log"
      - name: Check exact generic scalar capture inventory and placement
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_module_shared_generic_captures.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/generic-capture-replay.log"
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_generic_captures.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/generic-capture-planner.log"
      - name: Check planner units and five real native fragments
        env:
          IR8_PLANNER_NATIVE: '1'
          IR8_PLANNER_NATIVE_OUTPUT: ${{ runner.temp }}/ir8-source-fragments/native
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/planner.log"
      - name: Check source CLI snapshot and argument boundaries
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_source_v8_cli.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/source-cli-host.log"
      - name: Check opt-in DATA placement and coarse fallback
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_placement.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/placement.log"
      - name: Check bounded SUM planner and selected factories
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_sum.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/sum-planner.log"
      - name: Check finite self-family SUM planner and nested factories
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_recursive_sum.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/recursive-sum-planner.log"
      - name: Check closed monomorphic recursive function knots
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_monomorphic_recursion.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/monomorphic-recursion-planner.log"
      - name: Check recursive scalar and complete-view captures
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_recursive_captures.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/recursive-captures-planner.log"
      - name: Check ordinary callable captures and prior-plan preservation
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_callable_captures.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/callable-captures-planner.log"
      - name: Check exact nominal captures and prior-plan preservation
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_nominal_captures.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/nominal-captures-planner.log"
      - name: Check nominal-arrow callable captures and prior-plan preservation
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_nominal_callable_captures.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/nominal-callable-captures-planner.log"
      - name: Replay complete nominal vectors and nominal beta proofs
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_module_shared_nominal_arguments.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/nominal-shared-replay.log"
      - name: Check nominal shared-view planning and prior-plan preservation
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_shared_nominal_arguments.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/nominal-shared-planner.log"
      - name: Replay closed arrow arguments and outer-first arrow beta
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_module_shared_arrow_arguments.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/arrow-arguments-replay.log"
      - name: Check arrow shared-view planning and original callable identity
        run: |
          set -euo pipefail
          python3 -B tools/experimental/resource-native/tests/test_planner_v8_arrow_arguments.py \
            2>&1 | tee "$RUNNER_TEMP/ir8-source-fragments/arrow-arguments-planner.log"
      - name: Retain fragment evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ir8-source-fragments-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ir8-source-fragments
          if-no-files-found: warn
          retention-days: 14
  ir8-controlled-source:
    name: Controlled IR8 shared-source integration
    runs-on: ubuntu-24.04
    # Reuse one GHC install for 26 fresh cases (4 portable + 8 CLI + 3 coarse + 3 groups + 2 SUM + 2 self-SUM + 1 recursion + 1 captures + 2 callables).
    # Keep the 60-minute job ceiling and all per-process and memory limits unchanged.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # Same official bindist and checksum as ci.yml/compiler-shapes.yml.
      - name: Install pinned direct-host GHC 9.14.1
        run: |
          set -euo pipefail
          setup="$RUNNER_TEMP/ir8-shared-source-setup"
          mkdir -m 700 "$setup"
          sudo apt-get update 2>&1 | tee "$setup/apt-update.log"
          sudo apt-get install -y build-essential clang libgc-dev libgmp-dev libnuma-dev libncurses-dev pkg-config xz-utils \
            2>&1 | tee "$setup/apt-install.log"
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          curl --fail --location --connect-timeout 30 --max-time 600 \
            https://downloads.haskell.org/~ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz \
            -o "$archive" 2>&1 | tee "$setup/download.log"
          printf '%s  %s\n' 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841 "$archive" \
            | sha256sum -c - | tee "$setup/checksum.log"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ghc-9.14.1-x86_64-unknown-linux" && \
            ./configure --prefix="$RUNNER_TEMP/ghc" && make -j1 install) \
            2>&1 | tee "$setup/install.log"
          "$RUNNER_TEMP/ghc/bin/ghc" --numeric-version | tee "$setup/version.log"
          test "$(cat "$setup/version.log")" = 9.14.1
      - name: Build, capture, replay and run controlled sources
        run: |
          python3 -B tools/experimental/resource-native/tests/test_shared_source_native.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-shared-source"
      - name: Run fresh source CLI and explicit fault policies
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_cli.py \
            --integration --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-cli"
      - name: Run fresh nominal DATA and callable-field sources
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_nominal.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-nominal"
      - name: Run fresh nominal sources with opt-in DATA groups
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_nominal.py \
            --data-groups --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-data-groups"
      - name: Run fresh scalar-field SUM sources
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_sum.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-sum"
      - name: Run fresh finite self-family SUM sources
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_recursive_sum.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-recursive-sum"
      - name: Run a fresh closed monomorphic recursive function
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_monomorphic_recursion.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-monomorphic-recursion"
      - name: Run a fresh recursive function with scalar and shared-view captures
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_recursive_captures.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-recursive-captures"
      - name: Run fresh recursive functions with ordinary callable captures
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_callable_captures.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-callable-captures"
      - name: Retain source evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ir8-shared-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ir8-shared-source
            ${{ runner.temp }}/ir8-shared-source-setup
            ${{ runner.temp }}/ir8-source-cli
            ${{ runner.temp }}/ir8-source-nominal
            ${{ runner.temp }}/ir8-source-data-groups
            ${{ runner.temp }}/ir8-source-sum
            ${{ runner.temp }}/ir8-source-recursive-sum
            ${{ runner.temp }}/ir8-source-monomorphic-recursion
            ${{ runner.temp }}/ir8-source-recursive-captures
            ${{ runner.temp }}/ir8-source-callable-captures
          if-no-files-found: warn
          retention-days: 14

  ir8-nominal-captures-source:
    name: IR8 nominal recursive captures from fresh source
    runs-on: ubuntu-24.04
    # Keep the 26-case/60-minute job unchanged. This job runs the existing two
    # nominal-owner cases plus two nominal-arrow helper cases with one GHC setup.
    # Keep 20 minutes and all per-process caps. Stage19 took 6m56s for setup and
    # two cases; that observation is not a guarantee for four cases on every runner.
    # No preserved compiler capture substitutes for a fresh source invocation.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned direct-host GHC 9.14.1
        run: |
          set -euo pipefail
          setup="$RUNNER_TEMP/ir8-nominal-captures-setup"
          mkdir -m 700 "$setup"
          sudo apt-get update 2>&1 | tee "$setup/apt-update.log"
          sudo apt-get install -y build-essential clang libgc-dev libgmp-dev libnuma-dev libncurses-dev pkg-config xz-utils \
            2>&1 | tee "$setup/apt-install.log"
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          curl --fail --location --connect-timeout 30 --max-time 600 \
            https://downloads.haskell.org/~ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz \
            -o "$archive" 2>&1 | tee "$setup/download.log"
          printf '%s  %s\n' 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841 "$archive" \
            | sha256sum -c - | tee "$setup/checksum.log"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ghc-9.14.1-x86_64-unknown-linux" && \
            ./configure --prefix="$RUNNER_TEMP/ghc" && make -j1 install) \
            2>&1 | tee "$setup/install.log"
          "$RUNNER_TEMP/ghc/bin/ghc" --numeric-version | tee "$setup/version.log"
          test "$(cat "$setup/version.log")" = 9.14.1
      - name: Run fresh DATA and self-SUM owner captures
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_nominal_captures.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-nominal-captures"
      - name: Run fresh nominal-argument and nominal-result helper captures
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_nominal_callable_captures.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-nominal-callable-captures"
      - name: Retain nominal capture source evidence, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ir8-source-nominal-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/ir8-nominal-captures-setup
            ${{ runner.temp }}/ir8-source-nominal-captures
            ${{ runner.temp }}/ir8-source-nominal-callable-captures
          if-no-files-found: warn
          retention-days: 14
  ir8-nominal-shared-source:
    name: IR8 complete nominal shared arguments from fresh source
    runs-on: ubuntu-24.04
    # Two inferred sources; separate from the unchanged 26-case and four-case jobs.
    # Reuse these actual generated SUM files plus one synthetic DATA pair for guards.
    # Keep the hard job ceiling and every existing helper/process limit unchanged.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Install pinned direct-host GHC 9.14.1
        run: |
          set -euo pipefail
          setup="$RUNNER_TEMP/ir8-nominal-shared-setup"
          mkdir -m 700 "$setup"
          sudo apt-get update 2>&1 | tee "$setup/apt-update.log"
          sudo apt-get install -y build-essential clang libgc-dev libgmp-dev libnuma-dev libncurses-dev pkg-config xz-utils \
            2>&1 | tee "$setup/apt-install.log"
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          curl --fail --location --connect-timeout 30 --max-time 600 \
            https://downloads.haskell.org/~ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz \
            -o "$archive" 2>&1 | tee "$setup/download.log"
          printf '%s  %s\n' 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841 "$archive" \
            | sha256sum -c - | tee "$setup/checksum.log"
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ghc-9.14.1-x86_64-unknown-linux" && \
            ./configure --prefix="$RUNNER_TEMP/ghc" && make -j1 install) \
            2>&1 | tee "$setup/install.log"
          "$RUNNER_TEMP/ghc/bin/ghc" --numeric-version | tee "$setup/version.log"
          test "$(cat "$setup/version.log")" = 9.14.1
      - name: Run fresh inferred nominal identity and curried constant
        run: |
          python3 -B tools/experimental/resource-native/tests/test_source_v8_nominal_shared_arguments.py \
            --ghc "$RUNNER_TEMP/ghc/bin/ghc" --cc gcc \
            --output "$RUNNER_TEMP/ir8-source-nominal-shared"
      - name: Check nominal SUM packet and real-instantiation guards
        run: |
          timeout --signal=TERM --kill-after=5s 300s \
            python3 -B tools/experimental/resource-native/tests/test_nominal_argument_guards.py \
              --generated "$RUNNER_TEMP/ir8-source-nominal-shared/curried-const/native" \
              --cc gcc --output "$RUNNER_TEMP/ir8-nominal-sum-guards"
      - name: Prepare a host-checked synthetic DATA guard pair
        run: |
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -B tools/experimental/resource-native/tests/prepare_nominal_argument_guard_fixture.py \
              --output "$RUNNER_TEMP/ir8-nominal-data-guard-fixture"
      - name: Check nominal DATA packet and real-instantiation guards
        run: |
          timeout --signal=TERM --kill-after=5s 300s \
