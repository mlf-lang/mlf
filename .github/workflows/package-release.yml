name: Checked package release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing source tag for a new package release (for example packages/greeting/0.1.0-macos-arm64)
        required: true
        type: string
      manifest:
        description: Library manifest relative to the tagged checkout
        required: true
        default: examples/packages/greeting/mlf-package.json
        type: string
permissions:
  contents: read
concurrency:
  group: checked-package-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: macos-26
    timeout-minutes: 90
    outputs:
      source: ${{ steps.source.outputs.commit }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check exact tag and library manifest
        id: source
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PACKAGE_MANIFEST: ${{ inputs.manifest }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^[A-Za-z0-9][A-Za-z0-9._/+\-]*$ && "$RELEASE_TAG" != latest ]]
          git check-ref-format "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$(git rev-parse HEAD)"
          [[ "$PACKAGE_MANIFEST" != /* && "$PACKAGE_MANIFEST" != *..* ]]
          jq -e '.format == 1 and (.library.modules | length) > 0' "$PACKAGE_MANIFEST"
          printf 'commit=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Native dependencies
        run: |
          brew install llvm gmp pkg-config bdw-gc
          echo "$(brew --prefix llvm)/bin" >> "$GITHUB_PATH"
          echo "MLF_GC_PREFIX=$(brew --prefix bdw-gc)" >> "$GITHUB_ENV"
      - name: Fetch pinned published compiler and seed manager
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/release/fetch-seed.sh .mlf-build/package-seed .github/package-seed.env
      - name: Build updated manager while retaining the published compiler
        run: |
          tools/release/bootstrap-manager.sh .mlf-build/package-manager-bootstrap
          export MLF_PACKAGE_MANAGER="$PWD/.mlf-build/package-manager-bootstrap/bin/mlfpkg"
          "$MLF_PACKAGE_MANAGER" --compiler "$MLF_COMPILER" --runtime "$PWD/runtime/mlf_runtime.c" \
            --build-dir .mlf-build/package-tools --timeout 5400 --locked build --target mlfpkg
          echo "MLF_PACKAGE_MANAGER=$PWD/.mlf-build/package-tools/bin/mlfpkg" >> "$GITHUB_ENV"
      - name: Export and pack checked library
        env:
          PACKAGE_MANIFEST: ${{ inputs.manifest }}
          RELEASE_TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          lock="$(dirname -- "$PACKAGE_MANIFEST")/mlf.lock"
          if [ ! -f "$lock" ]; then "$MLF_PACKAGE_MANAGER" --manifest "$PACKAGE_MANIFEST" lock; fi
          if jq -e '(.tests // {} | length) > 0' "$PACKAGE_MANIFEST" >/dev/null; then
            "$MLF_PACKAGE_MANAGER" --manifest "$PACKAGE_MANIFEST" --compiler "$MLF_COMPILER" \
              --build-dir .mlf-build/package-export --locked test
          fi
          "$MLF_PACKAGE_MANAGER" --manifest "$PACKAGE_MANIFEST" --compiler "$MLF_COMPILER" \
            --build-dir .mlf-build/package-export --locked release .mlf-build/checked-library
          tools/release/prepare-package-release.sh .mlf-build/checked-library "$GITHUB_REPOSITORY" "$RELEASE_TAG" .mlf-build/package-upload
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: checked-package
          path: .mlf-build/package-upload/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  publish:
    needs: prepare
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.prepare.outputs.source }}
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: checked-package
          path: .mlf-build/package-upload
      - name: Publish complete asset set without replacing a release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          SOURCE_COMMIT: ${{ needs.prepare.outputs.source }}
        run: |
          tools/release/publish-package-release.sh .mlf-build/package-upload "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$SOURCE_COMMIT"
