name: IR8 branch owner reuse
on:
  pull_request:
    paths:
      - 'tools/experimental/resource-native/**'
      - '.github/workflows/ir8-owner-reuse.yml'
  push:
    branches:
      - 'codex/pr25-resource-ir-experiment-20261031'
    paths:
      - 'tools/experimental/resource-native/**'
      - '.github/workflows/ir8-owner-reuse.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ir8-owner-reuse-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  host:
    name: Optional branch reuse and existing planner checks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Check optional reuse and unchanged planner defaults
        env:
          PYTHONHASHSEED: '0'
        run: |
          set -euo pipefail
          evidence="$RUNNER_TEMP/ir8-owner-reuse"
          mkdir -m 700 "$evidence"
          timeout --signal=TERM --kill-after=5s 180s \
            python3 -B -S tools/experimental/resource-native/tests/test_branch_owner_reuse.py -v \
            2>&1 | tee "$evidence/owner-reuse.log"
          for suite in tools/experimental/resource-native/tests/test_planner_v8*.py; do
            timeout --signal=TERM --kill-after=5s 180s \
              python3 -B -S "$suite" -v \
              2>&1 | tee "$evidence/$(basename "$suite" .py).log"
          done
      - name: Retain host results, including failures
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: ir8-owner-reuse-host-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ir8-owner-reuse/
          if-no-files-found: warn
          retention-days: 14
