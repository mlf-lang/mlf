name: Cross-platform release
on:
  workflow_call:
    inputs:
      tag:
        description: Existing immutable tag matching VERSION
        required: false
        type: string
      validation_only:
        description: Qualify and package this exact workflow commit without publishing
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      tag:
        description: Existing immutable tag matching VERSION
        required: false
        type: string
      validation_only:
        description: Qualify and package this exact workflow commit without publishing
        type: boolean
        default: false
permissions:
  contents: read
  actions: read
env:
  GC_FREE_SPACE_DIVISOR: '1'
concurrency:
  # Supersede stale branch rehearsals, but never interrupt an actual release.
  group: ${{ inputs.validation_only && format('platform-validation-{0}', github.ref) || format('platform-release-{0}', inputs.tag || github.sha) }}
  cancel-in-progress: ${{ inputs.validation_only }}
jobs:
  metadata:
    runs-on: ubuntu-24.04
    outputs:
      source: ${{ steps.version.outputs.source }}
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.validation_only && github.sha || inputs.tag || github.sha }}
          fetch-depth: 0
      - name: Validate immutable source and requested platforms
        id: version
        env:
          REQUESTED_TAG: ${{ inputs.tag }}
          VALIDATION_ONLY: ${{ inputs.validation_only }}
        run: |
          set -euo pipefail
          tools/release/check.sh
          version=$(cat VERSION)
          tag="v$version"
          source=$(git rev-parse HEAD)
          if [ "$VALIDATION_ONLY" = true ]; then
            test -z "$REQUESTED_TAG"
            test "$source" = "$GITHUB_SHA"
          else
            test "$REQUESTED_TAG" = "$tag"
            test "$(git rev-parse "$tag^{commit}")" = "$source"
          fi
          # Artifact provenance is bound to the workflow run's head SHA. Select
          # this exact tag/ref when dispatching; a different ref must fail.
          test "$source" = "$GITHUB_SHA"
          printf 'source=%s\ntag=%s\nversion=%s\n' "$source" "$tag" "$version" >> "$GITHUB_OUTPUT"
  qualification:
    needs: metadata
    uses: ./.github/workflows/native-qualification.yml
    with:
      source: ${{ needs.metadata.outputs.source }}
      build_packages: true
  publish:
    if: ${{ !inputs.validation_only }}
    needs: [metadata, qualification]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.source }}
          fetch-depth: 0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: release-*
          merge-multiple: true
          path: .mlf-build/publish
      - name: Publish all three platforms without replacing released assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.metadata.outputs.tag }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source }}
        run: |
          set -euo pipefail
          cd .mlf-build/publish
          expected=("mlf-$RELEASE_VERSION-linux-x64.tar.gz" "mlf-$RELEASE_VERSION-macos-arm64.tar.gz" "mlf-$RELEASE_VERSION-windows-x64.zip")
          test "$(find . -maxdepth 1 -type f | wc -l)" -eq 3
          for file in "${expected[@]}"; do test -s "$file"; done
          sha256sum "${expected[@]}" > SHA256SUMS
          sha256sum --check --strict SHA256SUMS
          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo 'Refusing to replace an existing release or its assets.' >&2
            exit 1
          fi
          cd ../..
          test "$(git rev-parse "$RELEASE_TAG^{commit}")" = "$SOURCE_COMMIT"
          awk -v version="$RELEASE_VERSION" '$0 ~ "^## " version " " {active=1;next} /^## / {if(active)exit} active' CHANGELOG.md > .mlf-build/publish/NOTES.md
          gh release create "$RELEASE_TAG" --verify-tag --draft --prerelease --latest=false --title "MLF $RELEASE_VERSION — Windows, macOS and Linux preview" --notes-file .mlf-build/publish/NOTES.md .mlf-build/publish/*.tar.gz .mlf-build/publish/*.zip .mlf-build/publish/SHA256SUMS
          gh release edit "$RELEASE_TAG" --draft=false --prerelease --latest=false
  validation:
    if: ${{ inputs.validation_only }}
    needs: [metadata, qualification]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.metadata.outputs.source }}
      - name: Check all three packaged source commits without publishing
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ needs.metadata.outputs.source }}
          RELEASE_VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          for platform in macos-arm64 linux-x64 windows-x64; do
            tools/release/download-artifact.sh "$GITHUB_RUN_ID" "release-$platform" ".mlf-build/validation/$platform" "$SOURCE_COMMIT"
            name="mlf-$RELEASE_VERSION-$platform"
            if [ "$platform" = windows-x64 ]; then
              test "$(unzip -p ".mlf-build/validation/$platform/$name.zip" "$name/COMMIT")" = "$SOURCE_COMMIT"
            else
              test "$(tar -xOf ".mlf-build/validation/$platform/$name.tar.gz" "$name/COMMIT")" = "$SOURCE_COMMIT"
            fi
          done
          find .mlf-build/validation -type f \( -name '*.tar.gz' -o -name '*.zip' \) -exec sha256sum {} + > .mlf-build/validation/SHA256SUMS
          jq -n --arg source "$SOURCE_COMMIT" --arg run "$GITHUB_RUN_ID" '{complete:true,published:false,source:$source,run:$run,platforms:["macos-arm64","linux-x64","windows-x64"]}' > .mlf-build/validation/validation.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: validation-summary
          path: |
            .mlf-build/validation/validation.json
            .mlf-build/validation/SHA256SUMS
          retention-days: 30
