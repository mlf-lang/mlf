name: Bounded Patricia comparison
on:
  push:
    branches: [perf/patricia-as-exact-image-20261118]
permissions:
  contents: read
concurrency:
  group: bounded-patricia-20261118
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'mlf-lang/mlf' && github.ref == 'refs/heads/perf/patricia-as-exact-image-20261118'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Admit exact historical hosted image before building
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/patricia-admission" evidence
          python3 - <<'PY'
          import json, os, pathlib, sys
          actual=os.environ.get('ImageVersion')
          ok=actual=='20261111.370.1'
          record={'expected_image':'20261111.370.1','actual_image':actual,'accepted':ok,'policy':'No automatic retry or fallback image.'}
          pathlib.Path('evidence/image-admission.json').write_text(json.dumps(record,indent=2)+'\n')
          pathlib.Path(os.environ['RUNNER_TEMP'],'patricia-admission','image-admission.json').write_text(json.dumps(record,indent=2)+'\n')
          if not ok: sys.exit('STOP: exact runner image absent or mismatched')
          PY
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Isolated pinned source worktrees
        run: |
          mkdir -p evidence
          cp "$RUNNER_TEMP/patricia-admission/image-admission.json" evidence/
          git worktree add --detach old d8325d909c249fd82d4ad6173d44d8818cc6f8bf
          git worktree add --detach new ee495d5783fca3c26a3c0e659ebeac1bab76a37d
      - name: Official pinned GHC
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libgc-dev libgmp-dev libnuma-dev libncurses-dev pkg-config xz-utils
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          curl -fsSL https://downloads.haskell.org/~ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz -o "$archive"
          printf '%s  %s\n' 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ghc-9.14.1-x86_64-unknown-linux" && ./configure --prefix="$RUNNER_TEMP/ghc" && make install)
          test "$("$RUNNER_TEMP/ghc/bin/ghc" --numeric-version)" = 9.14.1
          echo "$RUNNER_TEMP/ghc/bin" >> "$GITHUB_PATH"
          rm "$archive"
      - name: Admit exact GHC and global package dump before producers
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,pathlib,shutil,subprocess,sys
          records={'accepted':False}
          try:
              ghc=pathlib.Path(shutil.which('ghc')).resolve()
              pkg=ghc.with_name('ghc-pkg')
              if not pkg.exists():pkg=pathlib.Path(shutil.which('ghc-pkg')).resolve()
              dump=subprocess.check_output([pkg,'dump','--global','--no-user-package-db'],text=True)
              digest=hashlib.sha256(dump.encode()).hexdigest()
              ghc_sha=hashlib.file_digest(ghc.open('rb'),'sha256').hexdigest()
              records={'ghc_sha256':ghc_sha,'package_database_sha256':digest,'accepted':ghc_sha=='38115f3ce136434725893c3e009f1c1c510f3f48ac32a293befbb79bbec34697' and digest=='7c5c88d13d3d9843cd868e849c9dcadea1ebd194020a789da5cd9a9d6b93e0e3'}
          except Exception as error:
              records={'accepted':False,'error_type':type(error).__name__,'error':str(error)[:400]}
          pathlib.Path('evidence/toolchain-admission.json').write_text(json.dumps(records,indent=2)+'\n')
          if not records['accepted']: sys.exit('STOP: GHC or global package dump mismatch')
          PY
      - name: Serial producers
        run: |
          set -euo pipefail
          mkdir -p evidence
          for source in old new; do
            (cd "$source" && python3 -B ../tools/shared/crc_process_supervisor.py --receipt ../evidence/"$source-build-supervisor.json" --work-seconds 1800 --cleanup-seconds 10 "$(command -v python3)" -B tools/shared/resource_watchdog.py --seconds 1740 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 ../evidence/"$source-build-guard" python3 tools/shared/build.py --bootstrap-only --optimization 2 --build-dir .mlf-build/shared-ghc) > "evidence/$source-build.log" 2>&1
            cp "$source/.mlf-build/shared-ghc/receipt.json" "evidence/$source-producer-receipt.json"
            cmp "$source/.mlf-build/shared-ghc/receipt.json" "evidence/$source-producer-receipt.json"
          done
      - name: Guarded 6 and 5.5 GiB address-space controls
        run: python3 -B tools/shared/crc_process_supervisor.py --receipt evidence/comparison-supervisor.json --work-seconds 1800 --cleanup-seconds 10 "$(command -v python3)" -B tools/research/patricia-comparison-20261118.py
      - name: Restore early admission evidence even after a failed checkout
        if: always()
        run: |
          mkdir -p evidence
          if test -f "$RUNNER_TEMP/patricia-admission/image-admission.json"; then
            cp "$RUNNER_TEMP/patricia-admission/image-admission.json" evidence/image-admission.json
          fi
      - name: Preserve all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bounded-patricia-comparison
          path: |
            evidence/
            old/.mlf-build/shared-ghc/receipt.json
            new/.mlf-build/shared-ghc/receipt.json
          retention-days: 14
