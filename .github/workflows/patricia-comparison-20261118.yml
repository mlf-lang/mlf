name: Bounded Patricia comparison
on:
  push:
    branches: [perf/patricia-surface-sham-20261119]
permissions:
  contents: read
concurrency:
  group: bounded-patricia-20261118
  cancel-in-progress: false
jobs:
  compare:
    if: github.repository == 'mlf-lang/mlf' && github.ref == 'refs/heads/perf/patricia-surface-sham-20261119'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Exact ordinary-comment sham source worktrees
        run: python3 -B tools/research/patricia-joint-generation.py prepare
      - name: Official pinned GHC
        timeout-minutes: 20
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y build-essential clang libgc-dev libgmp-dev libnuma-dev libncurses-dev pkg-config xz-utils
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          curl -fsSL https://downloads.haskell.org/~ghc/9.14.1/ghc-9.14.1-x86_64-deb12-linux.tar.xz -o "$archive"
          printf '%s  %s\n' 60f7ab75f28df892729fbaff3a54f58ee3ad7e731929f1b2f3eb0208f73de841 "$archive" | sha256sum -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/ghc-9.14.1-x86_64-unknown-linux" && ./configure --prefix="$RUNNER_TEMP/ghc" && make install)
          test "$("$RUNNER_TEMP/ghc/bin/ghc" --numeric-version)" = 9.14.1
          echo "$RUNNER_TEMP/ghc/bin" >> "$GITHUB_PATH"
          rm "$archive"
      - name: Freeze live cohort after setup and before all producers
        run: python3 -B tools/shared/crc_process_supervisor.py --receipt evidence/prebuild-lock-supervisor.json --work-seconds 90 --cleanup-seconds 10 "$(command -v python3)" -B tools/shared/resource_watchdog.py --seconds 75 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 evidence/prebuild-lock-guard python3 -B tools/research/patricia-comparison-20261118.py --freeze-prebuild
      - name: Serial producers
        run: |
          set -euo pipefail
          mkdir -p evidence
          python3 -B tools/shared/crc_process_supervisor.py --receipt evidence/all-builds-supervisor.json --work-seconds 1800 --cleanup-seconds 10 "$(command -v bash)" tools/research/patricia-surface-builds.sh
      - name: Native endpoints then comment-only sham at 6 GiB
        run: python3 -B tools/shared/crc_process_supervisor.py --receipt evidence/comparison-supervisor.json --work-seconds 1800 --cleanup-seconds 10 "$(command -v python3)" -B tools/research/patricia-comparison-20261118.py
      - name: Copy verifier receipts and raw outputs to visible evidence
        if: always()
        run: python3 -B tools/shared/crc_process_supervisor.py --receipt evidence/collect-supervisor.json --work-seconds 90 --cleanup-seconds 10 "$(command -v python3)" -B tools/shared/resource_watchdog.py --seconds 75 --address-space-mib 6144 --rss-mib 5120 --disk-free-mib 5120 evidence/collect-guard python3 -B tools/research/patricia-joint-generation.py collect
      - name: Preserve all diagnostic evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: bounded-patricia-comparison
          path: |
            evidence/
            old/.mlf-build/shared-ghc/receipt.json
            old_swap/.mlf-build/shared-ghc/receipt.json
          retention-days: 14
