name: Depth cursor finite Solver qualification
on:
  push:
    branches: [perf/depth-cursor-solver-qualification-20261117]
permissions:
  contents: read
concurrency:
  group: depth-cursor-solver-qualification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  focused:
    if: github.repository == 'mlf-lang/mlf' && github.event_name == 'push' && github.ref == 'refs/heads/perf/depth-cursor-solver-qualification-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Install pinned official GHC (300 second controller)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/performance/depth-cursor-solver-qualification/install.py --root "$RUNNER_TEMP/depth-cursor-solver"
      - name: Sequential O0 and O2 finite gate (180 second controller)
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/performance/depth-cursor-solver-qualification/qualify.py --root "$RUNNER_TEMP/depth-cursor-solver"
      - name: Bound and inventory all retained artifacts
        if: always()
        id: artifact-bound
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/depth-cursor-solver/artifacts" <<'PYART'
          import hashlib,json,pathlib,sys
          root=pathlib.Path(sys.argv[1]); rows=[]; total=0
          if not root.exists():
              root.mkdir(parents=True)
              (root/'artifact-note.txt').write_text('No installation/qualification artifacts were created; inspect job logs.\n')
          for p in sorted(root.rglob('*')):
              if p.is_dir(): continue
              if p.is_symlink() or not p.is_file(): raise SystemExit('Artifact special file rejected')
              b=p.read_bytes(); total+=len(b)
              rows.append(dict(path=str(p.relative_to(root)),bytes=len(b),sha256=hashlib.sha256(b).hexdigest()))
          data=(json.dumps(dict(files=rows,raw_bytes=total),indent=2)+'\n').encode()
          if total+len(data)>96*1024**2: raise SystemExit('Artifact exceeds96MiB; upload refused, original files retained on runner')
          with(root/'artifact-inventory.json').open('xb')as out: out.write(data)
          PYART
      - name: Preserve qualification evidence, including failures
        if: always() && steps.artifact-bound.outcome == 'success'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: depth-cursor-solver-${{ github.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/depth-cursor-solver/artifacts/
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
