name: macOS toolchain provenance
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - .github/workflows/macos-toolchain.yml
      - .github/workflows/ci.yml
      - tests/native/completion_cell_tests.c
      - tests/native/async_completion_primitives.c
      - runtime/mlf_runtime.c
      - tools/shared/build.py
      - tools/shared/test_darwin_toolchain.py
      - tools/release/test-macos-toolchain-workflow.mjs
      - tools/release/async-change-scope.py
      - tools/release/test-async-change-scope.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: macos-toolchain-${{ github.ref }}
  cancel-in-progress: true
jobs:
  provenance:
    name: GHC and LLVM toolchain provenance (macos-26)
    runs-on: macos-26
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Preserve checkout identity
        run: |
          mkdir -p .mlf-build/macos-toolchain
          git rev-parse HEAD > .mlf-build/macos-toolchain/checkout.txt
      - name: Decide whether expensive async parity was explicitly requested
        id: scope
        run: python3 tools/release/async-change-scope.py --output .mlf-build/macos-toolchain/async-scope.json
      - name: Install ordinary async native dependencies
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          brew install llvm@19 gmp pkg-config bdw-gc jq
          echo "$(brew --prefix llvm@19)/bin" >> "$GITHUB_PATH"
          echo "MLF_GC_PREFIX=$(brew --prefix bdw-gc)" >> "$GITHUB_ENV"
          # Keep the real link probe aligned with ordinary async parity.
          echo 'MACOSX_DEPLOYMENT_TARGET=26.0' >> "$GITHUB_ENV"
          echo 'GC_FREE_SPACE_DIVISOR=8' >> "$GITHUB_ENV"
      - name: Verify diagnostic-free native completion links
        run: |
          set -euo pipefail
          output="$PWD/.mlf-build/macos-toolchain"
          read -r -a cflags <<< "$(pkg-config --cflags gmp)"
          read -r -a libs <<< "$(pkg-config --libs gmp)"
          cflags+=("-I$MLF_GC_PREFIX/include")
          libs+=("$MLF_GC_PREFIX/lib/libgc.a" -lm -lpthread)
          clang -O2 -std=c11 -Wall -Wextra -Werror "${cflags[@]}" -c runtime/mlf_runtime.c -o "$output/runtime.o" > "$output/runtime.stdout" 2> "$output/runtime.stderr"
          test ! -s "$output/runtime.stderr"
          for native in completion_cell_tests async_completion_primitives; do
            clang -O2 -std=c11 -Wall -Wextra -Werror "${cflags[@]}" "tests/native/$native.c" "$output/runtime.o" "${libs[@]}" -o "$output/$native" > "$output/$native.link.stdout" 2> "$output/$native.link.stderr"
            test ! -s "$output/$native.link.stderr"
            "$output/$native" > "$output/$native.execute.stdout" 2> "$output/$native.execute.stderr"
            test ! -s "$output/$native.execute.stderr"
          done
      - name: Install pinned official GHC 9.14.1
        if: steps.scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/ghc-9.14.1.tar.xz"
          distribution=ghc-9.14.1-aarch64-apple-darwin
          curl -fsSL "https://downloads.haskell.org/~ghc/9.14.1/$distribution.tar.xz" -o "$archive"
          printf '%s  %s\n' 841591f152085be605616682779341847d24fd56bd6d22ca61bb37ee32b50681 "$archive" | shasum -a 256 -c -
          tar -xJf "$archive" -C "$RUNNER_TEMP"
          (cd "$RUNNER_TEMP/$distribution" && ./configure --prefix="$RUNNER_TEMP/ghc" && make install)
          test "$("$RUNNER_TEMP/ghc/bin/ghc" --numeric-version)" = 9.14.1
          echo "$RUNNER_TEMP/ghc/bin" >> "$GITHUB_PATH"
      - name: Exercise resolver and preparation rejection controls
        run: |
          set -euo pipefail
          python3 -B tools/shared/test_darwin_toolchain.py 2>&1 | tee .mlf-build/macos-toolchain/resolver.log
          python3 -O -B tools/shared/test_darwin_toolchain.py 2>&1 | tee .mlf-build/macos-toolchain/resolver-optimized.log
          python3 -B tools/shared/test_prepare_async_ghc.py
          python3 -O -B tools/shared/test_prepare_async_ghc.py
      - name: Build and authenticate actual GHC-origin async tools
        if: steps.scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          python3 -B tools/shared/prepare_async_ghc.py --build-dir .mlf-build/async-ghc --clang clang
          jq -e '.complete == true and .producer_host == "GHC" and .typecheck_only == false and .optimization == "2"' .mlf-build/async-ghc/receipt.json
          jq -e '.toolchain.files | keys | any(test("/libclang-cpp(\\.[0-9]+)*\\.dylib$"))' .mlf-build/async-ghc/receipt.json
          jq -e '.complete == true and .producer_host == "GHC" and .runner_protocol_version == 1' .mlf-build/async-ghc/async-tools.json
      - name: Qualify typed completions and structured process tasks
        if: steps.scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          compiler="$PWD/.mlf-build/async-ghc/bin/emlf"
          EMLF="$compiler" tests/fixtures/async-completion/check.sh
          tools/release/test-async-process.sh "$compiler" .mlf-build/async-process-parity
          tools/release/test-async-task.sh "$compiler" .mlf-build/async-task-parity
          jq -e '.complete == true and .backends == ["source-interpreter", "target-interpreter", "llvm"]' .mlf-build/async-completion-gate/result.json
          for suite in async-process-parity async-task-parity; do
            jq -e '.complete == true and .backends == ["interpreter", "llvm"]' ".mlf-build/$suite/result.json"
          done
      - name: Qualify checked async package interfaces and cache replay
        if: steps.scope.outputs.required == 'true'
        run: |
          set -euo pipefail
          compiler="$PWD/.mlf-build/async-ghc/bin/emlf"
          manager="$PWD/.mlf-build/async-ghc/bin/mlfpkg"
          tools/release/test-async-package.sh "$compiler" "$manager" .mlf-build/async-package-parity
          jq -e '.complete == true and .backend == "llvm" and .cache_replay == true and .opaque_rejections == 6 and .type_rejections == 1' \
            .mlf-build/async-package-parity/result.json
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: macos-toolchain-provenance
          include-hidden-files: true
          retention-days: 14
          path: |
            .mlf-build/macos-toolchain/
            .mlf-build/async-ghc/async-tools.json
            .mlf-build/async-ghc/receipt.json
            .mlf-build/async-ghc/*.stdout
            .mlf-build/async-ghc/*.stderr
            .mlf-build/async-ghc/*.txt
            .mlf-build/async-ghc/*.log
            .mlf-build/async-ghc/builtin-verification/
            .mlf-build/async-completion-gate/**/*.json
            .mlf-build/async-completion-gate/**/*.stdout
            .mlf-build/async-completion-gate/**/*.stderr
            .mlf-build/async-completion-gate/**/*.status
            .mlf-build/async-completion-gate/**/*.timed-out
            .mlf-build/async-process-parity/**/*.json
            .mlf-build/async-process-parity/**/*.stdout
            .mlf-build/async-process-parity/**/*.stderr
            .mlf-build/async-process-parity/**/*.status
            .mlf-build/async-process-parity/**/*.timed-out
            .mlf-build/async-task-parity/**/*.json
            .mlf-build/async-task-parity/**/*.stdout
            .mlf-build/async-task-parity/**/*.stderr
            .mlf-build/async-task-parity/**/*.status
            .mlf-build/async-task-parity/**/*.timed-out
            .mlf-build/async-package-parity/**/*.json
            .mlf-build/async-package-parity/**/*.stdout
            .mlf-build/async-package-parity/**/*.stderr
            .mlf-build/async-package-parity/**/*.status
            .mlf-build/async-package-parity/**/*.timed-out
